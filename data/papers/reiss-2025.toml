title = "Redshifted civilizations, galactic empires, and the Fermi paradox"
venue = "Acta Astronautica 246, 114–128 (September 2026); arXiv:2510.00377 (gr-qc)"
link = "https://arxiv.org/abs/2510.00377"
finding = """
Works out, within ordinary general relativity, what it would take for a civilisation to live in a
frame where time runs slowly: orbits near the photon radius of the galaxy's central black hole are
tolerable at biologically bearable accelerations and within reach of a civilisation well below the
level of harnessing a whole star, and one civilisation at that level could keep a galaxy-spanning
society running with a time-dilation factor of ten thousand, so a trip across the galaxy fits in a
lifetime as its citizens count it. Signals from such orbits would drift down in frequency. The
authors also argue that fast ships are so vulnerable that the dark forest's caution has a basis."""
