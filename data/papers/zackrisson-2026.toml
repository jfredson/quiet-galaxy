title = "Project Hephaistos -- IV. James Webb Space Telescope Observations of Two Dyson Sphere Candidates"
venue = "arXiv:2607.09460 (astro-ph.GA), 13 pages, 9 figures; a preprint (version 1, 2026-07-10), not yet found in a journal"
link = "https://arxiv.org/abs/2607.09460"
finding = """
James Webb Space Telescope infrared images and spectra of two of the seven red dwarf stars that the
2024 Hephaistos search flagged as possible Dyson-sphere hosts (candidates D and E) show that the
infrared excess comes from background galaxies about one arcsecond away, not from anything at the
stars: candidate D's is at redshift about 0.9 and looks like a hot-dust-obscured galaxy, candidate
E's at redshift about 0.4 and looks like a dusty starburst. The authors find no excess from
regions a few astronomical units from either star, which rules out both a Dyson sphere and an
extreme debris disk there. They conclude that the 2024 estimate of how often such a chance
alignment would happen was too low, and that future searches for Dyson spheres by mid-infrared
excess need sharper images than the all-sky survey provides."""
factors = ["detectable"]
