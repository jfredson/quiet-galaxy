title = "Constraining the Lifespan of Intelligent Technological Civilization in the Galaxy"
venue = "arXiv:2602.22252 (astro-ph.GA), 4 pages; accepted in Monthly Notices of the Royal Astronomical Society Letters"
link = "https://arxiv.org/abs/2602.22252"
finding = """
Turns the silence into a bound on the last piece of the equation: if life and intelligence arise as
readily as the optimists assume on Earth-like planets, then the absence of any contact means
technological civilisations last no more than about 5,000 years in the most optimistic case. The
authors stress that this is an upper bound derived from the silence itself, not a prediction of how
long civilisations actually last, and that our light cone already covers the whole galaxy's history
over the past hundred thousand years."""
