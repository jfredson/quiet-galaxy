id = "westby-2020"
date = "2020-06-15"
added_on = 2026-10-16
authors = ["Tom Westby", "Christopher J. Conselice"]
title = "The Astrobiological Copernican Weak and Strong Limits for Intelligent Life"
venue = "The Astrophysical Journal 896, 58 (2020)"
link = "https://doi.org/10.3847/1538-4357/ab8225"
finding = """
Instead of guessing the biological factors, the authors assume Earth is typical: under
their 'strong' assumption, intelligent life appears on a suitable planet between 4.5 and
5.5 billion years after the planet forms, as it did here, and only around stars with at
least the Sun's share of heavy elements. Combined with the galaxy's star-formation
history and a communicating lifetime of 100 years (ours so far), that gives at least about 36
communicating civilisations in the galaxy now, with a range of roughly 4 to 211, and a
nearest neighbour at most around 17,000 light years away, too far to talk to within a lifetime
at radio speeds. Under the weaker assumption (any time after 5 billion years) the count
rises to hundreds or more. The headline number was widely reported; the paper's own point
is that the answer hinges almost entirely on how long civilisations last."""
factors = ["life", "intelligence", "lifetime", "star-formation"]
explanations = ["interstellar-travel-impractical", "not-looked-long-enough"]
moved_range = false

notes = "Written 2026-10-16. Checked 2026-10-16 against the abstract: at least 36 (minus 32, plus 175) civilisations, so 4 to 211, for a communicating lifetime of 100 years, and a nearest neighbour at most 17,000 (minus 10,000, plus 33,600) light years away. The paper frames both as limits, which the finding now says."
