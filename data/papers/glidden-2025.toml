title = "JWST-TST DREAMS: Secondary Atmosphere Constraints for the Habitable Zone Planet TRAPPIST-1 e"
venue = "Astrophysical Journal Letters (2025), doi 10.3847/2041-8213/adf62e; arXiv:2509.05407"
link = "https://arxiv.org/abs/2509.05407"
finding = """
Four transits of TRAPPIST-1 e, an Earth-sized planet in the habitable zone of a red dwarf 40
light-years away, observed with JWST, with the star's own variability contaminating every visit.
The data give no strong evidence for or against an atmosphere: a bare rock fits, and so does a
nitrogen-rich atmosphere with traces of carbon dioxide and methane; hydrogen-rich atmospheres are
excluded and thick carbon dioxide atmospheres like Venus's or Mars's are weakly disfavoured. A
follow-up campaign of fifteen more transits, paired with transits of the airless inner planet to
cancel the star, is under way; its result had not been published by 2026-10-16."""
