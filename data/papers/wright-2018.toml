id = "wright-2018"
date = "2018-11"
added_on = 2026-10-16
authors = ["Jason T. Wright", "Shubham Kanodia", "Emily Lubar"]
title = "How Much SETI Has Been Done? Finding Needles in the n-dimensional Cosmic Haystack"
venue = "The Astronomical Journal 156, 260 (2018)"
link = "https://doi.org/10.3847/1538-3881/aae099"
finding = """
The authors define the space a radio search has to cover (where on the sky, how far,
which frequencies, how strong, how often, when, and how the signal is shaped) as a
many-dimensional haystack, and add up how much of it every search to date had looked
through. The total comes to about six parts in 10 to the power 18 of the plausible
volume, which they compare to somewhere between a large hot tub and a small swimming pool
of water drawn from all the Earth's oceans; Jill Tarter's earlier comparison was a single glass. The paper is the standard
answer to 'we have searched and found nothing': in a precise sense, we have hardly
searched at all, and the silence so far is a weak constraint on the number of
civilisations."""
factors = ["detectable"]
explanations = ["not-looked-long-enough", "listening-the-wrong-way"]
moved_range = false

notes = "Written 2026-10-16. Corrected 2026-10-16 against the paper: its text gives a combined fraction of about 6 x 10^-18 (about 8,000 litres out of 1.3 x 10^21 litres of ocean), a little under one part in 10^17, and its abstract compares that to a volume between a large hot tub and a small swimming pool."
