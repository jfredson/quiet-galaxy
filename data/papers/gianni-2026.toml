title = "A small polymerase ribozyme that can synthesize itself and its complementary strand"
venue = "Science 391 (6789), 1022-1028 (2026), doi 10.1126/science.adt2760; MRC Laboratory of Molecular Biology, Cambridge"
link = "https://www.science.org/doi/10.1126/science.adt2760"
finding = """
Reports QT45, an RNA molecule only 45 building blocks long, found by searching random sequences, that
copies RNA from three-letter pieces in slightly alkaline ice: it made its own complementary strand
from a random pool at 94.1% accuracy per letter and a copy of itself from defined pieces, each at a
yield of about 0.2% over 72 days. The authors argue that so small a copying machine means such
molecules are far commoner in the space of possible RNA sequences than assumed, which bears on how
improbable the first self-copying step was. The two halves of the cycle have not yet been joined
into full self-replication."""
