notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 42334373), which agree; the journal's own page refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the day it went online in both catalogues; the issue is dated 2026-06-01. It is an experiment with Earth microbes, not a measurement on Mars: it shows that life can make spots like those in the Cheyava Falls rock (hurowitz-2025) and does not show that life did, so no range is argued for."
