authors = ["Sev Zielinska", "Naomi Felton", "Philip B. Vixseboxse", "Sean McMahon"]
title = "Experimental Evidence for a Microbial Origin of Reduction Spots in Red Beds on Earth—and Mars?"
venue = "Astrobiology 26 (6), 485-491 (2026)"
link = "https://doi.org/10.1177/15311074261464015"
finding = """
A laboratory test of the idea behind the pale spots the Perseverance rover found in red rocks on
Mars, which have been called potential signs of life. The authors mixed sand with a rust-like iron
mineral, kept it without oxygen and added communities of microbes grown from soil and pond water.
Rounded bleached spots a few millimetres to a centimetre across appeared within weeks, and none
appeared in sterile samples; bacteria of kinds known to feed on iron were abundant in the bleached
areas. The authors say this strongly supports the long-held view that microbes can make such spots,
and that further experiments are needed to find out whether chemistry without life can make them
too."""
factors = ["life"]
