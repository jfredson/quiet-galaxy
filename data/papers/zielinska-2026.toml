id = "zielinska-2026"
date = "2026-06-23"
added_on = 2026-11-13
authors = ["Sev Zielinska", "Naomi Felton", "Philip B. Vixseboxse", "Sean McMahon"]
title = "Experimental Evidence for a Microbial Origin of Reduction Spots in Red Beds on Earth—and Mars?"
venue = "Astrobiology 26 (6), 485-491 (2026)"
link = "https://doi.org/10.1177/15311074261464015"
finding = """
A laboratory test of the idea behind the pale spots the Perseverance rover found in red rocks on
Mars, which have been called potential signs of life. The authors mixed sand with a rust-like iron
mineral, kept it without oxygen and added communities of microbes grown from soil and pond water.
Rounded bleached spots a few millimetres to a centimetre across appeared within weeks, and none
appeared in sterile samples; bacteria of kinds known to feed on iron were abundant in the bleached
areas. The authors say this strongly supports the long-held view that microbes can make such spots,
and that further experiments are needed to find out whether chemistry without life can make them
too."""
factors = ["life"]
explanations = ["rare-life", "great-filter-behind-us"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 42334373), which agree; the journal's own page refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the day it went online in both catalogues; the issue is dated 2026-06-01. It is an experiment with Earth microbes, not a measurement on Mars: it shows that life can make spots like those in the Cheyava Falls rock (hurowitz-2025) and does not show that life did, so no range is argued for. Checked 2026-11-15 against the version the authors posted on bioRxiv before peer review (https://www.biorxiv.org/content/10.64898/2026.01.12.699011v1.full, posted 2026-01-13), read in full apart from its supplement. It is not the published article, which may differ, and whose title adds 'on Earth, and Mars?'. Every statement in the finding matches that version and nothing was changed. The body adds limits worth keeping beside it. Six cultures were started from soil and pond mud; material from two of them made spots, and only one did so each time it was tried (three dishes of three), while the other's spot could not be made again. A dish given the same material with the cells filtered out made none, and neither did a dish given a single iron-feeding species grown on its own. The material added also carried sulphur compounds and organic acids that can dissolve the iron mineral without life, so the authors infer that microbes did the work and give five reasons, the filtered dish first among them. The spots lost iron and showed no gain in phosphorus or sulphur, which the Martian spots at Cheyava Falls do show. The authors call the study 'limited in size and scope' and say that showing microbes can make such spots 'does not imply that all reduction spots are biogenic'."
