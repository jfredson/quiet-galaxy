finding = """
Asks how many copying molecules random chemistry could assemble among the stars of the observable
universe (about ten to the 22) and finds chains of about 32 units, against the 40 to 100 that a
copying molecule needs, so life would not arise in the observable universe by chance alone. His way
out is the far larger universe that inflation implies, with more than ten to the 100 stars, where it
would. Like Koonin's, a bound on one mechanism and a count of stars needed, not a chance per planet."""
