authors = ["Michael Garrett"]
title = "Slysh haloes: the waste heat of cold computing as a submillimetre technosignature"
venue = "arXiv:2608.31153 (astro-ph.IM), 14 pages; submitted to Monthly Notices of the Royal Astronomical Society"
link = "https://arxiv.org/abs/2608.31153"
finding = """
Argues that a civilisation that does mostly computing would shed its waste heat as cold as it can,
far below the 100 to 600 kelvin that searches for Dyson spheres look for, because the cost of a
computation falls with temperature; a cold structure needs a vast radiating area, so it would be
conspicuous at submillimetre wavelengths rather than hidden. Existing far-infrared surveys could
already bound such cold waste heat at about ten to the twenty watts around nearby stars, several
orders of magnitude below past infrared limits, and red dwarfs are the best targets. The paper also
notes such civilisations may simply be asleep instead."""
