finding = """
Proposes that once a civilisation's industry runs itself off its planet, spreading between stars
becomes too cheap and useful to refuse, but it spreads quietly: small probes, robotic seed factories
and slow replication rather than star-harvesting empires. One such civilisation would saturate its
reachable neighbourhood within about ten million years, so the fact that none has reached us means
none arose within reach. The traces to look for are weak artefacts and local probes, not galaxy-scale
energy use. A preprint, not yet reviewed."""
