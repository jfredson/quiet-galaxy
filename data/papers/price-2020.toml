authors = ["Danny C. Price", "J. Emilio Enriquez", "Bryan Brzycki", "Steve Croft", "Daniel Czech", "David DeBoer", "Julia DeMarines", "Griffin Foster", "Vishal Gajjar", "Nectaria Gizani", "Greg Hellbourg", "Howard Isaacson", "Brian Lacki", "Matt Lebofsky", "David H. E. MacMahon", "Imke de Pater", "Andrew P. V. Siemion", "Dan Werthimer", "and 6 others"]
title = "The Breakthrough Listen Search for Intelligent Life: Observations of 1327 Nearby Stars over 1.10–3.45 GHz"
venue = "The Astronomical Journal 159, 86 (2020)"
link = "https://doi.org/10.3847/1538-3881/ab65f1"
finding = """
Breakthrough Listen, the privately funded ten-year radio search begun in 2016, reports
its first large survey: 1,327 stars within about 160 light years, observed with the
Green Bank and Parkes telescopes across a wide band of radio frequencies, with no signal
found that could not be traced to human interference. The authors turn the silence into
a limit: at 95 percent confidence, fewer than about 0.45 percent of the stars watched with Green
Bank host a narrow-band transmitter above about 2 trillion watts, and fewer than about 2
percent on the Parkes data above about 9 trillion watts (all the stars lie within 50 parsecs). The limits apply only to the narrow
kind of signal searched for, as the paper says, and to the moments the telescope was
looking."""
factors = ["detectable"]
explanations = ["not-looked-long-enough", "everyone-listens-nobody-transmits", "shouting-is-costly"]
moved_range = false

notes = "Corrected 2026-10-16 against the paper (arXiv:1906.07750) and Crossref: the paper has no 0.1 percent figure (the limits are 0.45 percent for Green Bank above 2 x 10^12 watts, 0.37 percent for the Green Bank S-band, 2 percent for Parkes above 9 x 10^12 watts); the author list has 24 names, the six beyond those listed being James A. Green, Jane F. Kaczmarek, Ronald J. Maddalena, Stacy Mader, Jamie Drew and S. Pete Worden; and the date is the journal's online date, 2020-02-05. Supersedes Enriquez and colleagues' 2017 survey of 692 stars (The Astrophysical Journal 849, 104)."
