link = "https://doi.org/10.1126/science.adp3411"
finding = """
Compares how the sensory parts of the forebrain are built in a chick, a gecko and a mouse, by
birth-dating neurons and mapping their genes, and finds that birds and mammals reach similar circuits
by different developmental routes: the neurons are not inherited from a common ancestor but arrived
at separately. One of a set of papers in the same issue (Zaremba and others on the bird forebrain's
cell types) read together as showing that complex cognition evolved at least twice among
vertebrates."""
