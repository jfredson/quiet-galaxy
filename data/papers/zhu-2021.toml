finding = """
A review of what the Kepler mission and other surveys show about how planets are spread among
stars, concentrating on orbits inside about the Earth-Sun distance, and of what those statistics say
about how planets form and move. Neither its abstract nor its full text concludes that the share of
stars with planets is close to 100 percent. Its summary says about 30 percent of Sun-like stars host
planets inside about the Earth-Sun distance (down to Earth's mass and size), averaging about three such
planets each; it also warns that the average number of planets per star and the share of stars with
planets are different quantities. It is logged without an estimate."""
