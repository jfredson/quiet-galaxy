id = "craddock-2026"
date = "2026-01"
added_on = 2026-11-14
authors = ["Maxwell L. Craddock", "Yasuhito Sekine", "Maryse Napoleoni", "Nozair Khawaja", "Shuya Tan", "Yamei Li", "Zening Yang", "Lucía Hortal Sánchez", "Ruiqin Yi", "Frank Postberg"]
title = "Laboratory simulations of organic synthesis in Enceladus: Implications for the origin of organic matter in the plume"
venue = "Icarus 444, 116836 (2026)"
link = "https://doi.org/10.1016/j.icarus.2025.116836"
finding = """
The Cassini spacecraft found that some ice grains thrown out by Saturn's moon Enceladus carry a
wide range of carbon-based molecules. The authors made solutions that imitate the moon's ocean and
ran them through two kinds of conditions in the laboratory: hot water of the kind expected near
vents on the sea floor, up to 150 degrees Celsius, and freezing, down to minus 40 degrees. With no
life involved, the hot-water runs produced amino acids along with aldehydes, carboxylic acids,
amines and nitriles, and freezing alone produced simple amino acids such as glycine. Most of the
hot-water products match what Cassini saw, which the authors read as support for a source deep
below the plume. Two things did not match: the experiments made amino acids that Cassini's
carbon-rich grains do not seem to show, and they could not make the large molecules with ring
structures and long carbon chains that Cassini did see. The authors suggest the first may be
hidden in salt-rich grains, and that the second may be left over from the moon's formation or made
at temperatures above 150 degrees."""
factors = ["life"]
explanations = ["rare-life"]
moved_range = false

notes = "Logged by hand on 2026-11-14, not by a reading. The finding is written from the paper's abstract and its four highlight lines, read on 2026-11-14 in the OpenAlex catalogue record for the DOI; the authors, the volume, the article number and the date are from the Crossref record, read the same day. The journal's own page refused the fetch (ScienceDirect, in a script and in the browser), and a copy listed at the Freie Universität Berlin's repository (https://refubium.fu-berlin.de/handle/fub188/50358) could not be opened, so the full text has not been read. The date is the month of the journal volume; Crossref created its record on 2025-10-01, which is when the article first went online. It bears on the chance that life starts because that factor's test names chemical signatures of life in Enceladus's plume: this paper shows that most of the small carbon-based molecules seen there can be made without life, so their presence is not by itself such a signature. It says nothing about whether the moon's ocean is sterile, which is what the rare-life explanation's test asks, and it gives no number, so no range is argued for."
