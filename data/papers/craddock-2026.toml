# Publication record. Layout in docs/record-schema.md. Logged by hand on 2026-11-14: the journal
# catch-up pass of 2026-11-13 found this paper by its title and could not open it, and John asked
# for it to be read and logged the next day.
# Publication records are appended and never edited except to fix an error, with a changelog line.

id = "craddock-2026"
date = "2026-01"
added_on = 2026-11-14
authors = ["Maxwell L. Craddock", "Yasuhito Sekine", "Maryse Napoleoni", "Nozair Khawaja", "Shuya Tan", "Yamei Li", "Zening Yang", "Lucía Hortal Sánchez", "Ruiqin Yi", "Frank Postberg"]
title = "Laboratory simulations of organic synthesis in Enceladus: Implications for the origin of organic matter in the plume"
venue = "Icarus 444, 116836 (2026)"
link = "https://doi.org/10.1016/j.icarus.2025.116836"
finding = """
The Cassini spacecraft found that some ice grains thrown out by Saturn's moon Enceladus carry a
wide range of carbon-based molecules. The authors made solutions that imitate the moon's ocean and
ran them through two kinds of conditions in the laboratory: hot water of the kind expected near
vents on the sea floor, up to 150 degrees Celsius, and freezing, down to minus 40 degrees. With no
life involved, the hot-water runs produced amino acids along with aldehydes, carboxylic acids,
amines and nitriles, and freezing alone produced simple amino acids such as glycine. Most of the
hot-water products match what Cassini saw, which the authors read as support for a source deep
below the plume. Three things did not match: the experiments made amino acids that Cassini's
carbon-rich grains do not seem to show, they could not make the large molecules with ring
structures and long carbon chains that Cassini did see, and they made none of the ethers or
esters whose fragments Cassini found in freshly thrown-out grains. The authors suggest the first may be
hidden in salt-rich grains, and that the second may be left over from the moon's formation or made
at temperatures above 150 degrees."""
factors = ["life"]
explanations = ["rare-life"]
moved_range = false

notes = "Logged by hand on 2026-11-14, not by a reading. The finding is written from the paper's abstract and its four highlight lines, read on 2026-11-14 in the OpenAlex catalogue record for the DOI; the authors, the volume, the article number and the date are from the Crossref record, read the same day. The journal's own page (ScienceDirect) refused an automatic fetch, and a copy listed at the Freie Universität Berlin's repository (https://refubium.fu-berlin.de/handle/fub188/50358) could not be opened, so the full text has not been read. The date is the month of the journal volume; Crossref created its record on 2025-10-01, which is when the article first went online. It bears on the chance that life starts because that factor's test names chemical signatures of life in Enceladus's plume: this paper shows that most of the small carbon-based molecules seen there can be made without life, so their presence is not by itself such a signature. It says nothing about whether the moon's ocean is sterile, which is what the rare-life explanation's test asks, and it gives no number, so no range is argued for. Checked 2026-11-15 against the published article, which is open access at the publisher's site (17 pages of text): the abstract, the introduction, the results, the discussion and the conclusions were read, and the methods and the supplement were not. One error was fixed. The finding said two things did not match Cassini's measurements; the discussion (section 4.3) names a third, that neither ethers nor esters formed although Cassini detected their fragments in fresh plume grains, and the finding now says three. That count was this record's wording and not the abstract's. Everything else in the finding matches. The body adds limits worth keeping beside it. The starting solutions already held formaldehyde, hydrogen cyanide and ammonia, and the authors say they added the last two at relatively high strengths, within the range Cassini's data allow, so one reading of the missing amino acids is that the real ocean is weaker. Heating ran for 72 hours with no minerals present, where water inside the moon may react for far longer and beside rock. Freezing made glycine and little else: the authors say they cannot rule out contamination, though they judge the glycine real, and a signal that looked like the amino acid histidine was probably not one. They conclude that pockets of brine in the ice are unlikely to be a main source of the plume's carbon-based molecules. Repeating the heating and freezing changed nothing; what formed was set by the first heating, with two to three times as much at 150 degrees as at 70. The conclusions also say plainly that the experiments 'cannot reproduce multiple characteristics' of Cassini's measurements, which is more guarded than the abstract's 'good agreement'."
