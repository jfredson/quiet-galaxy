title = "WISE/CatWISE Constraints on Dysonian Waste-Heat Technosignatures in Nearby Galaxies"
venue = "The Astronomical Journal 171 (3), 131 (2026), doi 10.3847/1538-3881/ae31e9; arXiv:2601.07297"
link = "https://arxiv.org/abs/2601.07297"
finding = """
Looks for the infrared glow of waste heat at the scale of whole galaxies, using the WISE all-sky
survey on the galaxies of the 2MASS Redshift Survey with active nuclei and starbursts removed. No
galaxy shows it: the typical limit per galaxy is about five to nine hundred million times the Sun's
luminosity of waste heat at 150 to 600 kelvin, and no more than about one in 6,500 nearby galaxies
can host such heat at the thresholds the sample can test. For a civilisation using a galaxy's worth
of starlight at 300 kelvin the limit is about one galaxy in 6,000."""
