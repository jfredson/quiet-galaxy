finding = """
A second look at K2-18 b with a different Webb instrument, working at longer infrared
wavelengths than the 2023 observation. The authors report a feature they attribute to
dimethyl sulfide or the related dimethyl disulfide, at about three standard deviations
of confidence and at concentrations thousands of times higher than Earth's, and say that
no known process other than life produces so much. The announcement was reported
worldwide as the strongest hint yet of life beyond Earth. Three standard deviations is
below the level physicists treat as a discovery, the authors said so, and within weeks
other groups had reanalysed the same data and found the feature could not be
distinguished from noise or from other gases (the three entries that follow)."""
