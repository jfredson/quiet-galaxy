# Publication records are appended and never edited except to fix an error, with a changelog line.

id = "pavlov-2026"
date = "2026-02-04"
added_on = 2026-11-13
authors = ["Alexander A. Pavlov", "Caroline Freissinet", "Daniel P. Glavin", "Christopher H. House", "Jennifer C. Stern", "Amy C. McAdam", "Anais Roussel", "Jason P. Dworkin", "Luoth Chou", "Andrew Steele", "Paul R. Mahaffy", "Denise Buckner", "Felipe Gomez"]
title = "Does the Measured Abundance Suggest a Biological Origin for the Ancient Alkanes Preserved in a Martian Mudstone?"
venue = "Astrobiology 26 (2), 154-161 (2026)"
link = "https://doi.org/10.1177/15311074261417879"
finding = """
The Curiosity rover measured 30 to 50 parts per billion of long chain-shaped carbon molecules (alkanes
with 10 to 12 carbon atoms) in the Cumberland mudstone in Gale crater on Mars. Using a laboratory
measurement of how fast radiation destroys an organic molecule held in dry rock, the authors estimate
that before about 80 million years of exposure the rock held 120 to 7,700 parts per million of them,
between four thousand and some 250 thousand times more. They say that much cannot readily be explained by organic matter falling in on dust and
meteorites or settling out of an ancient haze, and they weigh two sources that could supply it: one
without life (organic molecules made in hot water underground and carried in) and one with life (an
ancient Martian biosphere). They do not choose between the two."""
factors = ["life"]
explanations = ["rare-life", "great-filter-behind-us"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 41635998), which agree; the journal's own page refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the day it went online in both catalogues; the issue is dated 2026-02-01. It bears on the test for the chance life starts (chemical signatures of life on Mars) in the same way as the Jezero crater papers (hurowitz-2025 and murphy-2026): it raises the amount of organic carbon to be explained and leaves the question of life open, so no range is argued for. Checked 2026-11-15 against the published article, in a copy the lead author sent on request: the whole main text was read (five pages), and the supplement was not. Two errors were fixed in the finding, both this record's wording and not the abstract's. It said the estimate rests on measurements of how fast radiation destroys 'such molecules'; the paper has no such measurement for these chain-shaped molecules in rock and uses the rate measured for an amino acid (isovaline) in dry silicate, which the authors call 'one hypothesis based on the best of our current knowledge' and expect to understate the loss, since the real rock was damp and held salts that speed it. And it said the rock once held 'thousands of times more'; 30 parts per billion against 120 to 7,700 parts per million is about four thousand to about 250 thousand times. Everything else in the finding matches. The body adds limits worth keeping beside it. The exposure age is 78 million years, give or take 30 million, from three measures that agree. Dust from space, by the authors' sum, could have left about 0.1 parts per billion, a million times too little. On the source without life they write that they 'cannot rule out' organic molecules made in hot water elsewhere and carried in, and that no amount can be put on it because neither the place nor the yield is known; the rock itself shows no sign of having been hotter than 60 to 80 degrees Celsius. They call the source with life 'the most speculative' and write 'we do not claim that proof of ancient martian life was found'. Their case that life could supply that much is by comparison with Earth, where lake and sea sediments hold from under one to a few hundred parts per million of similar molecules and some ancient rocks more. One check that could tell the two apart, whether chains with even numbers of carbon atoms dominate as they do in living things, cannot be made: the rover's instrument, as it was run, could only have seen chains of 10 to 12 carbon atoms. The authors ask for laboratory measurements of how fast radiation destroys these molecules in rock like this one."
