id = "pavlov-2026"
date = "2026-02-04"
added_on = 2026-11-13
authors = ["Alexander A. Pavlov", "Caroline Freissinet", "Daniel P. Glavin", "Christopher H. House", "Jennifer C. Stern", "Amy C. McAdam", "Anais Roussel", "Jason P. Dworkin", "Luoth Chou", "Andrew Steele", "Paul R. Mahaffy", "Denise Buckner", "Felipe Gomez"]
title = "Does the Measured Abundance Suggest a Biological Origin for the Ancient Alkanes Preserved in a Martian Mudstone?"
venue = "Astrobiology 26 (2), 154-161 (2026)"
link = "https://doi.org/10.1177/15311074261417879"
finding = """
The Curiosity rover measured 30 to 50 parts per billion of long chain-shaped carbon molecules (alkanes
with 10 to 12 carbon atoms) in the Cumberland mudstone in Gale crater on Mars. Using laboratory
measurements of how fast radiation destroys such molecules, the authors estimate that before about
80 million years of exposure the rock held 120 to 7,700 parts per million of them, thousands of
times more. They say that much cannot readily be explained by organic matter falling in on dust and
meteorites or settling out of an ancient haze, and they weigh two sources that could supply it: one
without life (organic molecules made in hot water underground and carried in) and one with life (an
ancient Martian biosphere). They do not choose between the two."""
factors = ["life"]
explanations = ["rare-life", "great-filter-behind-us"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 41635998), which agree; the journal's own page refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the day it went online in both catalogues; the issue is dated 2026-02-01. It bears on the test for the chance life starts (chemical signatures of life on Mars) in the same way as the Jezero crater papers (hurowitz-2025 and murphy-2026): it raises the amount of organic carbon to be explained and leaves the question of life open, so no range is argued for."
