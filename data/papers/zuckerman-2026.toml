authors = ["B. Zuckerman"]
title = "Broadband Searches for Extraterrestrial Technological Intelligence: A New Strategy to Find Nearby Alien Civilizations"
venue = "The Astrophysical Journal 1001 (2), 167 (2026)"
link = "https://doi.org/10.3847/1538-4357/ae4c38"
finding = """
An argument about how searches have been designed. The author says published searches for signals
have generally not started from a model of what a civilisation trying to reach us would send, and
so have often been poorly matched to it; radio searches have looked at only a modest share of the
few hundred thousand nearby stars that matter. He argues that ordinary sky surveys made for other
reasons, in radio and visible light, already cover the whole sky and could have caught a strong,
steady signal aimed at Earth by a nearby civilisation, but that it is too early to state a firm
limit because most of the radio band and nearly all of the infrared are unexplored. He adds that the
absence of any probe in the solar system suggests no civilisation has passed within about 100
light-years of Earth in the past few billion years, and that surveys of this kind could give a
first upper limit, below 100,000 or even 10,000, on the number of civilisations in the galaxy that
are trying to communicate."""
factors = ["detectable"]
explanations = ["not-looked-long-enough"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. Read on 2026-11-13 on the journal's own page, where the full text is open: the abstract and the closing section, with the passage on travel times; the sections in between were not read closely. The author's name is given as the catalogue and the paper give it, with an initial. The upper limits of 100,000 and 10,000 are what the author says such surveys could yield, not limits he derives, and they bound the number of civilisations, which is the product of all seven factors, not this factor alone; no range is argued for. Listed under the explanation that we have not looked long enough because that record's test names a demonstration that past searches had systematic gaps."
