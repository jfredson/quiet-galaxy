title = "Redox-driven mineral and organic associations in Jezero Crater, Mars"
venue = "Nature 645, 332–340 (2025)"
link = "https://doi.org/10.1038/s41586-025-09413-0"
finding = """
The Perseverance rover found, in a mudstone called Cheyava Falls in an old river channel on Mars,
organic carbon together with tiny nodules and millimetre-scale reaction fronts of iron phosphate and
iron sulfide, the minerals that form on Earth when organic matter feeds reactions at low temperature,
most often with microbes involved. The team found no strong evidence for a non-biological route and
no sign of the heating that one would need, but cannot rule it out: the paper calls the features
potential biosignatures and says the drilled sample must be examined on Earth to settle it. The
sample is sealed on the rover, and the mission to bring it back is unfunded."""
