finding = """
The James Webb Space Telescope's Rocky Worlds programme measured the heat from the day sides of
LTT 1445 A b and c, two rocky planets of a red dwarf 6.9 parsecs away, the nearest such system.
Planet b glows at about 528 kelvin, as a dark bare rock would; with an earlier spectrum this limits
its carbon dioxide to under 0.6 thousandths of a bar and its whole atmosphere to about 0.1 bar or
less, so the authors conclude it has no substantial atmosphere. Planet c (about 625 kelvin) is
poorly measured and only atmospheres of a bar or more carrying carbon dioxide are ruled out. The
authors say the line between red-dwarf planets that keep air and those that lose it (the 'cosmic
shoreline') cannot lie much farther toward the airless side than predicted."""
