notes = "Logged by the weekly reading of 2026-11-14 (data/readings/2026-11-14.toml), which found it in arXiv's listing by date and read the abstract on the arXiv page and in arXiv's own catalogue entry; the full text was not read. The eighteen authors are as arXiv lists them. Both planets orbit closer to their star than the band where water stays liquid, so, like the TRAPPIST-1 b and c results already in the log (Gillon and colleagues, 2026; Zieba and colleagues, 2023), it says how often rocky red-dwarf planets keep air, not how many habitable planets there are per star, and no range is argued for."
