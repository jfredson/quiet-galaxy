title = "Project Hephaistos III. Characterizing Anomalous Infrared Sources Identified As Dyson-sphere Candidates"
venue = "arXiv:2607.25701 (astro-ph.SR, with astro-ph.GA), 11 pages"
link = "https://arxiv.org/abs/2607.25701"
finding = """
Follows up the seven red dwarf stars within 300 parsecs that the 2024 Hephaistos search flagged for
unexplained infrared excess, plus three similar objects. Their stellar properties are ordinary and
the excess still has no clear explanation; it resembles the glow of a disk around a young star, but
the stars show no signs of youth. For two of the seven, new JWST images show a very red background
galaxy sitting behind the star, which explains their excess without any structure around the star.
No candidate is confirmed as artificial."""
