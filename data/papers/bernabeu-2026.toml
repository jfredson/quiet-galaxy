authors = ["Moisès Bernabeu", "Saioa Manzano-Morales", "Marina Marcet-Houben", "Toni Gabaldón"]
title = "Gene ancestries reveal diverse microbial associations during eukaryogenesis"
venue = "Nature 656, 399–405 (2026)"
link = "https://doi.org/10.1038/s41586-026-10639-9"
finding = """
Reconstructs the gene set of the last common ancestor of complex cells from thousands of genomes and
finds its genes came from several bacterial partners beyond the archaeal host and the ancestor of
mitochondria: Myxococcota (3.9% of the ancestral proteome) and Planctomycetota (2.2%) alongside the
Alphaproteobacteria (4.0%) and Asgard archaea (3.3%), with giant viruses ferrying genes, and with the
mitochondrion acquired late in a protracted process rather than in one founding event. The origin of
complex cells looks less like a single freak capture and more like a long succession of associations
inside a microbial community."""
