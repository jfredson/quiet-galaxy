authors = ["Jian-Kang Li", "Zhen-Zhao Tao", "Tong-Jie Zhang"]
title = "Narrowband Radio Technosignature Search Toward 3I/ATLAS with FAST"
venue = "The Astrophysical Journal 1006 (2), 163 (2026)"
link = "https://doi.org/10.3847/1538-4357/ae8025"
finding = """
China's Five-hundred-meter Aperture Spherical Telescope listened to 3I/ATLAS, the third object seen
passing through the solar system from another star, for about four hours spread over four dates
between October 2025 and January 2026, at radio frequencies from 1.05 to 1.45 gigahertz. The search
was for the kind of signal only a transmitter makes: very narrow in frequency and drifting as the
source moves. None was found. Because the object was so close, the search would have caught a
transmitter sending in all directions with only about three thousandths of a watt."""
explanations = ["they-are-already-here"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. Read on 2026-11-13 on the journal's own page, where the full text is open: the abstract, the table of sensitivities for the four dates (2.862 to 5.497 thousandths of a watt) and the closing section. The authors' names are as the journal's page gives them; the Crossref record adds the Chinese characters. The date is the day it went online. It is a null result at one band of frequencies for one object, and it fits the reading of 3I/ATLAS as a natural comet (seligman-2025). It bears on no factor's range."
