id = "siegert-2023"
date = "2023-01-24"
added_on = 2026-10-16
authors = ["Thomas Siegert", "Moritz M. M. Pleintinger", "Roland Diehl", "Martin G. H. Krause", "Jochen Greiner", "Christoph Weinberger"]
title = "Galactic Population Synthesis of Radioactive Nucleosynthesis Ejecta"
venue = "Astronomy and Astrophysics 672, A54 (2023), doi 10.1051/0004-6361/202244457; arXiv:2301.10192"
link = "https://arxiv.org/abs/2301.10192"
finding = """
Models the galaxy's glow of radioactive aluminium-26, which massive stars scatter and which gamma
rays reveal through the dust, and finds the observed distribution is reproduced only with a star
formation rate of 4 to 8 solar masses a year, two to four times the conventional figure of about 2,
with a supernova rate of 1.8 to 2.8 per century. The paper gives masses only, not a count of stars.
Science News's report of it (Ken Croswell, 2023-02-23) converted the masses to about 10 to 20 stars
born a year; at half a solar mass per star, the conversion this site uses, it is 8 to 16. Either is
above the top of the range this site used when the paper was logged (1 to 10; the top is now 20).
The abstract notes that an unknown but strong foreground at 1.8 MeV could be present."""
factors = ["star-formation"]
explanations = []
moved_range = true

notes = "Logged by the first weekly reading, 2026-10-16; the reading record says which records it was read against and with what verdict. Flagged for me: the estimate is above the range's top, and whether the range's top should rise is his call (the reading's limits, docs/weekly-reading.md). Moved the range on 2026-10-17: I ruled on the outside review that the top of the star-formation range rises from 10 to 20 (moved_range changed from false to true with a changelog line). Checked 2026-10-17 against the paper (arXiv HTML version of 2301.10192, https://arxiv.org/abs/2301.10192) and the Crossref record: the abstract gives a star formation rate of 4 to 8 solar masses a year, a supernova rate of 1.8 to 2.8 per century and the foreground remark, in solar masses only; there is no conversion to a number of stars in the paper. The conversion to 10 to 20 stars a year is Science News's (https://www.sciencenews.org/article/milky-way-star-formation-astronomy, which also gives the 'two to four times the conventional estimate'), and the 8 to 16 is this site's own arithmetic at 0.5 solar masses per star; the finding now says so. A&A 672, A54 (2023), published online 2023-03-30. The sentence in the finding that if some of the emission is local the rate sits at the low end of the new range is removed: it is not in the abstract."
