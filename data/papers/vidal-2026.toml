link = "https://arxiv.org/abs/2605.21093"
finding = """
A long review of every kind of technological trace that has been proposed, ordered by scale from the
solar system to the edge of the observable universe: planetary surfaces and atmospheres, stellar
energy use, compact objects, communication, travel, and galaxy-scale engineering, including
neutrinos and gravitational waves as carriers. It argues for searches that combine biosignatures with
technosignatures and for looking for anomalies without assuming a technology. A map of what has and
has not been searched for."""
