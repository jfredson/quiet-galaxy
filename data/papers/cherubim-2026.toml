id = "cherubim-2026"
date = "2026-07-16"
added_on = 2026-11-13
authors = ["Collin Cherubim", "Shreyas Vissapragada", "Tim Cunningham", "Annabella G. Meech", "David Charbonneau", "Robin Wordsworth", "Aaron Householder", "Johanna Teske", "Leonardo A. Dos Santos", "Nicole L. Wallack", "William Misener", "Zifan Lin", "Andrew McWilliam", "Michael Zhang", "Jason A. Dittmann", "Mercedes López-Morales"]
title = "Helium escaping from the atmosphere of a nearby rocky exoplanet orbiting in a habitable zone"
venue = "Science 393 (6815), 998-1001 (2026)"
link = "https://doi.org/10.1126/science.aea9708"
finding = """
Observations in near-infrared light of LHS 1140b, a rocky planet in the band around a nearby red
dwarf star where water could stay liquid, show helium escaping from the planet as it crosses the
face of its star. The helium was seen in 2024 and not in 2025, so the escape changes with time. The
authors read this as an upper atmosphere made mostly of helium and short of hydrogen, with heavier
gases held lower down. No helium was seen at LHS 1140c, a smaller and more strongly heated planet
of the same star."""
factors = ["habitable-planets"]
explanations = ["rare-earth", "we-are-early"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 42461987), which agree; Science's own site refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the first online publication that Europe PMC gives, and a Nature news story about the paper is dated the next day (https://doi.org/10.1038/d41586-026-02200-5, opened 2026-11-13); Crossref gives the issue date, 2026-09-03, with the volume and pages. It is evidence that one rocky planet in the liquid-water band of a red dwarf has kept an atmosphere, which is the question the TRAPPIST-1 records turn on; it is one planet, not a count, and the abstract says nothing about water or about the lower atmosphere's make-up, so no range is argued for."
