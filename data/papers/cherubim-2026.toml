# Publication records are appended and never edited except to fix an error, with a changelog line.

id = "cherubim-2026"
date = "2026-07-16"
added_on = 2026-11-13
authors = ["Collin Cherubim", "Shreyas Vissapragada", "Tim Cunningham", "Annabella G. Meech", "David Charbonneau", "Robin Wordsworth", "Aaron Householder", "Johanna Teske", "Leonardo A. Dos Santos", "Nicole L. Wallack", "William Misener", "Zifan Lin", "Andrew McWilliam", "Michael Zhang", "Jason A. Dittmann", "Mercedes López-Morales"]
title = "Helium escaping from the atmosphere of a nearby rocky exoplanet orbiting in a habitable zone"
venue = "Science 393 (6815), 998-1001 (2026)"
link = "https://doi.org/10.1126/science.aea9708"
finding = """
Observations in near-infrared light of LHS 1140b, a rocky planet in the band around a nearby red
dwarf star where water could stay liquid, show helium escaping from the planet as it crosses the
face of its star. The helium was seen in 2024 and not in 2025, so the escape changes with time. The
authors read this as an upper atmosphere made mostly of helium and short of hydrogen, with heavier
gases held lower down. No helium was seen at LHS 1140c, a smaller and more strongly heated planet
of the same star."""
factors = ["habitable-planets"]
explanations = ["rare-earth", "we-are-early"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record and in Europe PMC (PubMed number 42461987), which agree; Science's own site refused an automatic fetch and the full text has not been read, so this is abstract only. The date is the first online publication that Europe PMC gives, and a Nature news story about the paper is dated the next day (https://doi.org/10.1038/d41586-026-02200-5, opened 2026-11-13); Crossref gives the issue date, 2026-09-03, with the volume and pages. It is evidence that one rocky planet in the liquid-water band of a red dwarf has kept an atmosphere, which is the question the TRAPPIST-1 records turn on; it is one planet, not a count, and the abstract says nothing about water or about the lower atmosphere's make-up, so no range is argued for. Checked 2026-11-15 against the authors' own copy of the paper on arXiv (https://arxiv.org/abs/2607.14326, posted 2026-07-15 and marked there as published in Science the next day): the main text was read (pages 1 to 8 of 53), and the figures' captions, the methods and the supplement were not. It is the authors' text and not the journal's typeset pages. Every statement in the finding matches and nothing was changed. The main text adds limits worth keeping beside it. The helium was seen during one crossing, on the night of 2024-09-23, as extra absorption of about 1.2 percent, with signs of gas ahead of the planet; the 2025 crossing showed none, and the authors show that a weaker escape below what they could detect that year would explain it. They take the signal to be gas flowing off an atmosphere, driven by the star's X-ray and ultraviolet light, at about 200 to 400 thousand kilograms a second, and they say they weighed and excluded the star's own activity and Earth's air as causes (in the supplement, not read). Earlier studies of this planet had not detected an atmosphere and had only ruled out clear, hydrogen-rich ones. The helium result is about the upper atmosphere; the authors say the air lower down could be richer in heavier gases, and that any water would stay low because it freezes out before reaching the top, about 7 parts per million at that level by their estimate. So the main text does speak of water, as the abstract does not, but as an expectation and not a detection. For LHS 1140c they add that an earlier measurement of its day-side heat already pointed to little or no atmosphere."
