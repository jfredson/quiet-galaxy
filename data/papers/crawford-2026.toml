title = "Some Thoughts on the Future of Technosignature Searches: Constraining the Fermi Paradox"
venue = "arXiv:2606.00463 (astro-ph.IM); for Advancing the Search for Technosignatures, Proceedings of IAU Symposium 404 (forthcoming)"
link = "https://arxiv.org/abs/2606.00463"
finding = """
Asks how future searches could tell apart the explanations for the silence, above all whether
technological civilisations are rare or hidden, and proposes a programme that pairs expanded radio
and optical listening with searches for artefacts in the solar system. The artefact searches have a
time advantage: they probe evidence that accumulated over the solar system's history rather than
needing a civilisation to be active at the same moment as us. In particular, micron-scale
technological debris in lunar and planetary soils could constrain past activity in the galaxy."""
