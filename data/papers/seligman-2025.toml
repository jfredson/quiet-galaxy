finding = """
Reports the third object ever seen passing through the solar system from another star, found on
2025-07-01: an orbit far too open to be bound (eccentricity about 6.1), arriving at about 58
kilometres a second, with a compact cloud of dust around it and a colour like other primitive small
bodies. Everything measured fits a natural comet. Later work and the 2025 observations treated it as
such; a minority argued for an artificial origin, and no evidence for one has been found."""
