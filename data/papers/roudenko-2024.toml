title = "Exploring Fermi's Paradox using an Intragalactic Colonization Model"
venue = "arXiv:2411.00061 (physics.soc-ph, with q-bio.PE)"
link = "https://arxiv.org/abs/2411.00061"
finding = """
Simulates competing civilisations spreading between stars, each with a population, an environment
and a technology level that grow at their own rates, and with battles when they meet. Civilisations
whose three rates are out of balance collapse; balanced ones can come to dominate, but even the
largest leave big gaps between their colonies, so small civilisations survive in the gaps. A model
result in favour of settlement that spreads unevenly and leaves regions unreached."""
