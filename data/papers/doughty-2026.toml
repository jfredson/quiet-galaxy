id = "doughty-2026"
date = "2026-09-22"
added_on = 2026-11-13
authors = ["Christopher E. Doughty", "Cameron Hrabak", "Benjamin C. Wiebe", "Zephyr Kennan", "Denis E. Sergeev", "Michael Gowanlock"]
title = "Calculating potential cumulative carbon fixed and evolutionary stage for Earthlike planets in our solar neighborhood"
venue = "International Journal of Astrobiology 25, e14 (2026)"
link = "https://doi.org/10.1017/S1473550426100378"
finding = """
The authors start from a hypothesis they state as such: that how far life on a planet has evolved
goes in step with the total carbon its plants and microbes have ever taken up through
photosynthesis. They estimate Earth's total at about 9.4 times ten to the 25 grams of carbon. Their
climate simulations of TRAPPIST-1e, treated as an ocean world with Earth's present level of carbon
dioxide, find it would need 18 billion years to match that, against an estimated age of 7.6
billion, so they place it at a possible microbial stage. Applying the method to 29 nearby planets
that may be able to support life, they find two that pass Earth's total and so could have
multicellular and intelligent life, and six more at a possible multicellular stage."""
factors = ["intelligence"]
explanations = ["rare-intelligence", "we-are-early"]
moved_range = false

notes = "Logged by hand on 2026-11-13, not by a reading. The paper appeared in a journal and not on the arXiv preprint listing the weekly readings search; it came to notice through a Centauri Dreams post of 2026-10-02 (https://www.centauri-dreams.org/2026/10/02/photosynthesis-a-new-angle-into-fermis-paradox/). The finding is written from the paper's abstract, read on 2026-11-13 in the Crossref record, which also gives the authors, the volume and the date it went online; the full text has not been read, and a figure from the blog post that is not in the abstract is left out. Two of 29 planets is not a measurement of how often intelligence follows from life: it follows from the hypothesis in the first sentence, which the paper does not test, and it lies inside the range the site already uses for that factor. No range is argued for. Listed under the explanation that we are early because the paper's worked case, TRAPPIST-1e, orbits a red dwarf star, and that explanation's test turns on whether such planets can support life. Checked 2026-11-15 against the published article, which is free to read at the journal (30 pages): the abstract, the introduction's statement of the hypothesis, the results, the table of the 29 planets, most of the discussion and the conclusion were read; the methods were skimmed and the supplement was not read. Every statement in the finding matches and nothing was changed. The body adds limits worth keeping beside it. The authors say of their hypothesis that they 'cannot either prove or disprove' it and call it untestable. The counts in the finding are for one of five scenarios (near-infrared light usable, the drier of two modelled climates, 30 percent land). If only visible light can be used, no planet passes the multicellular mark under that climate; with a thick carbon dioxide atmosphere, 11 of the 29 pass Earth's total, and the authors think so thick an atmosphere unlikely. The two planets that pass Earth are K2-3d, at about 1.7 times Earth's total, and GJ 1061c, at about the same as Earth's; a ceiling on photosynthesis at 35 degrees Celsius removes both, and the authors note K2-3d may be closer to a small Neptune. They name as their largest uncertainty what the planets' atmospheres are made of, 'or indeed even whether an atmosphere exists on these planets at all', and say they may overestimate carbon taken up on planets with no night. Two small differences inside the paper: the body gives about 17 billion years for TRAPPIST-1e where the abstract and the table give 18, and the body says seven planets reach the multicellular mark, counting the two, where the table shows eight, which is the abstract's two and six."
