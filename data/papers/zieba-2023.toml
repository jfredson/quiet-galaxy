authors = ["Sebastian Zieba", "Laura Kreidberg", "Elsa Ducrot", "Michaël Gillon", "Caroline Morley", "and others"]
title = "No thick carbon dioxide atmosphere on the rocky exoplanet TRAPPIST-1 c"
venue = "Nature 620, 746–749 (2023)"
link = "https://doi.org/10.1038/s41586-023-06232-z"
finding = """
The same measurement as greene-2023 for the second planet of TRAPPIST-1, which gets about
as much light as Venus does. Its day side is around 380 kelvin, cooler than bare rock
would be but far too hot for a thick carbon-dioxide atmosphere; the data allow at most a
thin atmosphere or none. Together the two results suggest that the inner planets of the
system either never had much atmosphere or lost it to the star's radiation early on, which
is the pessimistic case for planets around red dwarfs. The habitable-zone planets further
out (e, f and g) are the real test, and their measurements are harder and still coming
in."""
