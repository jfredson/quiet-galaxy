id = "nakajima-2026"
date = "2026-01-15"
added_on = 2026-11-13
authors = ["Miki Nakajima", "Sarah K. Harter", "Alex V. Jasko", "Danae N. Polsin", "Ian Szumila", "Kim A. Cone", "Victor Lherm", "Eric G. Blackman", "Francis Dragulet", "Lars Stixrude", "Dustin Trail", "Margaret F. Huff", "J. Ryan Rygg", "Angel Paz", "Gilbert W. Collins", "Alexa LaPierre", "Zaire Sprowal"]
title = "Electrical conductivities of (Mg,Fe)O at extreme pressures and implications for planetary magma oceans"
venue = "Nature Astronomy 10 (2), 248-257 (2026)"
link = "https://doi.org/10.1038/s41550-025-02729-x"
finding = """
A planet's magnetic field is made by moving material that conducts electricity; on Earth today that
is the liquid iron of the outer core. The authors squeezed a common deep-rock mineral with laser
shocks to pressures of 467 to 1,400 gigapascals, as found deep inside rocky planets larger than
Earth, and measured how well it conducts. Putting the result into a model of how such planets cool,
they predict that a layer of molten rock at the bottom of the mantle can drive a magnetic field in
rocky planets heavier than three to six Earths, almost ten times stronger than the field the core
would make and lasting several billion years."""
explanations = ["rare-earth"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the abstract and the opening and closing paragraphs of the main text, read on 2026-11-13 on the journal's own page, where the full text is open; the methods were not read. The date is the day it went online; the journal dates the issue 2026-02. Listed under the Rare Earth explanation because that record's test names evidence of long-lived magnetic fields on many rocky planets. This is a prediction from a laboratory measurement and a model, for planets heavier than Earth; no magnetic field has been measured on any rocky planet around another star, and the paper says such a detection remains challenging. It bears on no factor's range."
