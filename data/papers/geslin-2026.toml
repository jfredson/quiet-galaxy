id = "geslin-2026"
date = "2026-08"
added_on = 2026-11-14
authors = ["Erik Geslin"]
title = "Incorporating an exopsychological biocentric contact-willingness factor into the Drake Equation"
venue = "Acta Astronautica 245, 644–651 (2026)"
link = "https://doi.org/10.1016/j.actaastro.2026.03.030"
finding = """
The Drake Equation counts civilisations that are able to communicate. The author argues that
being able to and wanting to are two different things, and proposes one more term for the
equation: the share of communicating civilisations that are willing to contact a species like
ours. His reasoning is that a civilisation which lasts long enough to become very advanced has
probably learned to live in balance with the other life on its planet and to value all of it, and
that such a civilisation may see no reason to contact a species that fights among itself and
damages its own living world. He ties the new term to the older ideas that advanced civilisations
keep a rule of not interfering, or treat Earth as a reserve.

He gives the term four values for illustration: one in a thousand if the others are extremely
selective, one in a hundred if they are watching and waiting as the zoo hypothesis has it, a half
if their attitudes are mixed, and nine in ten if most of them seek contact. Taking a set of
textbook values for the other terms that gives about 6.6 communicating civilisations in the
galaxy, the one-in-a-thousand value leaves an expected 0.0066 of them willing to contact us,
which he notes is consistent with a long silence even when several civilisations are transmitting.

The paper also reports a small online survey. One hundred people read a description of a planet
whose intelligent species lives in balance with the other life there, and of a second planet
whose intelligent species exploits and kills the others and has wrecked its climate. Asked
whether they would want to contact each, 83 percent said yes to the first and 18 percent to the
second. The author takes those two percentages as the centres of two spreads of values for the
new term and runs the count of contacts under each; the two differ by a factor of four to five.

He says the numbers are tools for reasoning and not claims about the galaxy: the survey shows
how people judge and gives no insight into how any other kind of mind would. He also says the
term cannot be measured at present and is hard to separate from the equation's other terms,
since a short lifetime, few civilisations that transmit and rare intelligence would each produce
the same silence. He draws a practical consequence: if willingness is low, searches should look
for signs a civilisation gives off without meaning to and should not wait for a message sent on
purpose."""
factors = ["detectable"]
explanations = ["no-interest-in-contact", "zoo-hypothesis"]
moved_range = false

notes = "Logged by hand on 2026-11-14, not by a reading. First written that day from the journal's preview page (ScienceDirect), which John opened in his browser and saved after the page had refused a script and the browser pane: the highlights, the abstract, the introduction and the opening sentences of each later section. Corrected later the same day from the full article, which John downloaded through the Arizona State University library and which was read in full (all eight pages). The correction fixes an error the preview led to: the first version said the factor of four to five came from the paper's pessimistic, neutral and optimistic cases. It does not. Those cases are single illustrative values (section 4: 0.001, 0.01, 0.5 and 0.9), and the factor of four to five comes from a separate exercise (sections 4.3 to 4.7) in which the answers of 100 survey participants, 83 percent and 18 percent willing, are used as the most likely values of two triangular spreads (0.70, 0.83, 0.90 and 0.05, 0.18, 0.30) run 1,000 times each; with 6.6 communicating civilisations the median count of contacts is 5.28 under the first and 1.23 under the second. The worked example of 6.6 uses one star a year, a fifth of stars with planets, one habitable planet per system, 0.33 for life, 0.01 for intelligence, 0.1 for communication and a lifetime of 10,000 years (section 4.2); the paper offers these as commonly discussed values for illustration, and they are not estimates of its own, so none is entered against a factor. The volume and page numbers are on the article's first page; the date is the month of the journal volume, and the article went online on 2026-03-12. It bears on the share of civilisations that are detectable because the two explanations it draws on lower that share for a reason of choice and not of ability, and the paper turns that choice into a separate term. It is an argument with worked cases and a survey of human attitudes, not a measurement of anything beyond Earth, and the author says so. It meets neither explanation's test for being strengthened or weakened, and no range is argued for. The article carries the author's statement that he used ChatGPT only to improve the language and readability of the text."
