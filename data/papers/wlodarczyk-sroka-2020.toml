id = "wlodarczyk-sroka-2020"
date = "2020-09"
added_on = 2026-10-16
authors = ["Bart S. Wlodarczyk-Sroka", "Michael A. Garrett", "Andrew P. V. Siemion"]
title = "Extending the Breakthrough Listen nearby star survey to other stellar objects in the field"
venue = "Monthly Notices of the Royal Astronomical Society 498, 5720–5729 (2020)"
link = "https://doi.org/10.1093/mnras/staa2672"
finding = """
A radio telescope pointed at one star also hears every other star in its beam. Using the
Gaia catalogue of star positions and distances, the authors count how many stars were in
the beams of price-2020's 1,327 target stars: 288,315, out to thousands of light
years, most of them far more distant than the targets. Because a transmitter at a greater
distance has to be more powerful to be heard, the limits are weaker for those stars, but
there are two hundred times more of them. The paper's result is that no more than about
0.04 percent of stars within about 650 light years (200 parsecs) host a transmitter of at
least 2.5 x 10^14 watts that is on most of the time, the first limit of its kind on a sample that large, and a reminder that the
sky has been searched less than it feels."""
factors = ["detectable"]
explanations = ["not-looked-long-enough", "everyone-listens-nobody-transmits"]
moved_range = false

notes = "Written 2026-10-16. Corrected 2026-10-16 against the abstract of the final (second) version: the count is 288,315 stellar objects up from 1,327 targets (not pointings), and the 0.04 percent limit holds within 200 parsecs (about 650 light years, not 1,000) for a transmitter of at least 2.5 x 10^14 watts; the paper also gives about 0.07 percent within 50 parsecs at 10^13 watts. The first version of the paper had different numbers."
