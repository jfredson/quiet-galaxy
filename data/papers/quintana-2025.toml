id = "quintana-2025"
date = "2025-03-11"
added_on = 2026-10-16
authors = ["Alexis L. Quintana", "Nicholas J. Wright", "Juan Martínez García"]
title = "A census of OB stars within 1 kpc and the star formation and core collapse supernova rates of the Milky Way"
venue = "Monthly Notices of the Royal Astronomical Society 538 (2), 1367-1383 (2025), doi 10.1093/mnras/staf083; arXiv:2503.08286"
link = "https://arxiv.org/abs/2503.08286"
finding = """
Maps 24,706 hot, massive stars within a kiloparsec of the Sun and from their numbers and ages works
out how fast such stars form and how often they explode. Scaled to the whole galaxy that gives a
star formation rate of 0.67 solar masses a year and a core-collapse supernova rate of 0.4 to 0.5
per century, both lower than earlier estimates, which the authors put down to a better census and
newer models of how stars evolve. Nearby supernovae come about 2.5 times per billion years, close
to the rate at which Earth has suffered mass extinctions with no settled cause, which the authors
take as support for a supernova behind one or more of them (the paper names the late Devonian and
late Ordovician events, 372 and 445 million years ago)."""
factors = ["star-formation"]
explanations = ["hostile-galaxy", "natural-catastrophes"]
moved_range = false

notes = "Logged by the first weekly reading, 2026-10-16. The star-formation figure here (0.67 solar masses a year, roughly 2 to 3 stars a year at Siegert 2023's conversion) sits inside the range this site uses, on its low side; Siegert 2023's figure sits above it. The two together are the spread of the current measurements. Checked 2026-10-17: the arXiv listing (https://arxiv.org/abs/2503.08286, submitted 2025-03-11) names three authors, the third being Juan Martínez García; the Crossref record gives Monthly Notices 538 (2), 1367-1383, doi 10.1093/mnras/staf083, published 2025-03-17; and the paper's own text (arXiv HTML version) says the near-Earth core-collapse rate of about 2.5 per billion years is consistent with one or both of the late Devonian and late Ordovician extinction events, 372 and 445 million years ago, citing Bond and Grasby (2017), so the extinctions are the paper's wording and not only the press release's."
