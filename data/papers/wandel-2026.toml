moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. Read on 2026-11-13 on the journal's own page, where the full text is open: the abstract, the method, the results table and the closing section. The date is the day it went online; Crossref gives 2026-01-10 as the publication date. Its companion paper, printed beside it (part I, https://doi.org/10.3847/1538-4357/ae21d7), sets out the wider band and is not logged separately because it gives no count. The paper's one to two planets per star lies above the top of the range the site uses for this factor (0.01 to 1 planet per star). The catch-up pass was told to move no range, so the range is unchanged and the number is reported to John. It rests on the Kepler count the site already uses (bryson-2020) and on the assumption that the night side of a planet with one face always to its star can keep liquid water, which is a model and has not been observed."
