authors = ["Amri Wandel"]
title = "Exoplanets beyond the Conservative Habitable Zone. II. Occurrence"
venue = "The Astrophysical Journal 996 (2), 133 (2026)"
link = "https://doi.org/10.3847/1538-4357/ae2262"
finding = """
A calculation, not a new survey. The author widens the band around a star in which a planet could
have liquid water, by counting planets that always keep one face to their star and could hold water
on the night side or under ice, and then scales the result to the published Kepler count of small
planets (about 0.5 per star in the usual band for stars like the Sun and a little cooler). With the
wider band he finds that planets able to support life may be up to 50 times more common than the
strictest estimate, which counts only the usual band around Sun-like stars: approximately one to
two small habitable planets per star, and up to 700 within 10 parsecs (about 33 light-years) of the
Sun. The paper puts the error of its own sums at roughly 30 percent and says the underlying
uncertainties are much larger."""
factors = ["habitable-planets"]
