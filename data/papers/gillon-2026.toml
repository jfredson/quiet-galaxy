title = "No thick atmosphere around TRAPPIST-1 b and c from JWST thermal phase curves"
venue = "Nature Astronomy 10 (5), 674-694 (2026)"
link = "https://doi.org/10.1038/s41550-026-02806-9"
finding = """
The James Webb Space Telescope followed the heat given off by the two innermost planets of the red
dwarf star TRAPPIST-1 through their whole orbits, day side and night side. TRAPPIST-1 b has a hot
day side (490 kelvin, give or take 17), no measurable heat from its night side and no shift of its
hottest point, which is what a dark rock with no air looks like. TRAPPIST-1 c has a cooler day side
(369 kelvin, give or take 23) and a night side as cold, which fits either a very thin oxygen-rich
atmosphere or a more reflective bare rock. Atmospheres with a surface pressure above about one bar,
roughly Earth's, are strongly disfavoured for both planets."""
factors = ["habitable-planets"]
explanations = ["rare-earth", "we-are-early"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 on the journal's own page, which also gives the date it went online; the full text is behind a paywall and has not been read, so this is abstract only. The 33 authors, the volume and the pages are Crossref's. It extends the two earlier day-side measurements of the same planets (greene-2023 and zieba-2023) to the night sides and is listed against the same records. Both planets orbit closer to the star than the band where water stays liquid, so the result says nothing directly about the planets in that band; it gives no count of planets per star and no range is argued for."
