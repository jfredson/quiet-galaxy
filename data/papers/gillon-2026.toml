title = "No thick atmosphere around TRAPPIST-1 b and c from JWST thermal phase curves"
venue = "Nature Astronomy 10 (5), 674-694 (2026)"
link = "https://doi.org/10.1038/s41550-026-02806-9"
finding = """
The James Webb Space Telescope followed the heat given off by the two innermost planets of the red
dwarf star TRAPPIST-1 for 59 hours without a break, long enough to cover a whole orbit of the
inner planet and nine tenths of an orbit of the next, day side and night side. TRAPPIST-1 b has a hot
day side (490 kelvin, give or take 17), no measurable heat from its night side and no shift of its
hottest point, which is what a dark rock with no air looks like. TRAPPIST-1 c has a cooler day side
(369 kelvin, give or take 23) and a night side as cold, which fits either a very thin oxygen-rich
atmosphere or a more reflective bare rock. Atmospheres with a surface pressure above about one bar,
roughly Earth's, are strongly disfavoured for both planets."""
factors = ["habitable-planets"]
explanations = ["rare-earth", "we-are-early"]
moved_range = false

notes = "Logged by hand on 2026-11-13 in the catch-up pass over this year's journals, not by a reading. It was found by listing the journal by date through Crossref, the public catalogue that publishers register papers with, as step 1a of the weekly reading does. The finding is written from the paper's abstract, read on 2026-11-13 on the journal's own page, which also gives the date it went online; the full text is behind a paywall and has not been read, so this is abstract only. The 33 authors, the volume and the pages are Crossref's. It extends the two earlier day-side measurements of the same planets (greene-2023 and zieba-2023) to the night sides and is listed against the same records. Both planets orbit closer to the star than the band where water stays liquid, so the result says nothing directly about the planets in that band; it gives no count of planets per star and no range is argued for. Checked 2026-11-14 against the full text on the journal's page, read with a subscription: the whole main text was read; the methods, the extended data and the supplement were not. One error was fixed in the finding. It had said the telescope followed both planets 'through their whole orbits', which was this record's wording and not the abstract's; the paper says the 59 hours of observation cover a full orbit of planet b and 90 percent of planet c's. Everything else in the finding matches the abstract, and the main text agrees with it while being more guarded in three places, which are recorded here and not in the finding. First, the abstract calls planet b's surface dark, and the main text says its surface 'should not be very dark' and fits best as fresh rock of the kind found in a planet's mantle. Second, for planet c the main text calls the result 'more ambiguous': its night-side heat is consistent with none, but at the outer edge of the uncertainty could be more than half its day-side signal. Third, for planet b two atmospheres are not strictly ruled out (one bar of carbon dioxide with a thick haze, and a very thin nitrogen one); the authors call them 'very fine-tuned' and conclude it is 'highly unlikely' that the planet has a significant atmosphere. The paper also reports a possible transit of a very small unconfirmed eighth planet, which the authors say is too weak a signal to count as a detection; it is not used here."
