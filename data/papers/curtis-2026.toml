notes = "Logged by hand on 2026-10-18, not by a reading: the audit of the 2026-10-17 reading found it missing from the log. Read on arXiv's own page on 2026-10-18 (abstract, discussion, conclusions). The title is as arXiv lists it; the paper's own title line drops the word Infrared. A limit on other galaxies' waste heat, not on any of the seven factors: it bounds the product of all of them and moves no range on its own (the detectable record's test says so)."
