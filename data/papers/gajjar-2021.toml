date = "2021-07"
added_on = 2026-10-16
authors = ["Vishal Gajjar", "Karen I. Perez", "Andrew P. V. Siemion", "Griffin Foster", "Bryan Brzycki", "and 21 others"]
title = "The Breakthrough Listen Search for Intelligent Life Near the Galactic Center. I."
venue = "The Astronomical Journal 162, 33 (2021)"
link = "https://doi.org/10.3847/1538-3881/abfd36"
finding = """
The centre of the galaxy packs the most stars into the smallest patch of sky, so a
single pointing covers tens of millions of them, and a civilisation wanting to be heard
across the galaxy might reasonably signal from or toward it. Breakthrough Listen observed
the central region for about 18 hours (7.0 with Parkes and 11.2 with Green Bank) between
1 and 8 gigahertz, and found no artificial signals, though it did pick up bursts from a
known magnetar. The limits are coarse because the stars are so far away: only a
transmitter far more powerful than anything humans have built would have been seen. The
paper lays out the plan for a deeper survey of the region and is the first of a series."""
factors = ["detectable"]
explanations = ["not-looked-long-enough", "everyone-listens-nobody-transmits"]
moved_range = false

notes = "Written 2026-10-16. Corrected 2026-10-16 against the paper's abstract: the observing time was about 18 hours, not seven, the frequency range is 1 to 8 gigahertz, and the paper has 26 authors (the 'Breakthrough Listen team' is not one). Later Breakthrough Listen results (a machine-learning search of 820 stars by Peter Ma and colleagues in Nature Astronomy, 2023, and the ongoing MeerKAT survey) should be logged by the weekly scan as it reads them."
