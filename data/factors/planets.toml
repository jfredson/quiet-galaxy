# Factor record: fp, the share of stars that have planets. Layout in docs/record-schema.md.
# Written 2026-10-16 as the schema's worked example; rewritten with the full published record
# the same evening (Saturday session A, run early at John's ruling). The outside review of the seven ranges ran on 2026-10-17 and John ruled on it
# the same day; this range is "reviewed".

id = "planets"
symbol = "fp"
order = 2
name = "The share of stars that have planets"
unit = "fraction"
description = """
Of all the stars in the galaxy, what fraction have at least one planet. In 1961 this was
a guess; since the first exoplanet discoveries in the 1990s and the Kepler mission of 2009
to 2018 it has become one of the two best-measured factors in the equation. The current
reading is that planets are the rule, not the exception: every method that counts them,
whether by the dip in a star's light as a planet crosses it, by the wobble of the star, or by
the bending of light from a background star, finds planets around most or all stars."""
what_would_move_this = "A survey that counts planets around a large, well-understood sample of stars, including the dim red dwarfs that make up most of the galaxy, and reports the share of stars with none."

verify = [
  "Zhu and Dong (2021, zhu-2021), the Annual Review of Astronomy and Astrophysics survey of planet statistics, is logged for this factor, but the reviewer's statement that it concludes the share of stars with planets is close to 100 percent was not found in its abstract or in coverage, and the full text has not been read for it; until it is, there is no estimate to add. Raised 2026-10-17 by the outside review (item 6); open.",
  "Drake's 1961 range of 0.2 to 0.5 for fp is quoted from the Wikipedia article on the Drake equation, which cites Drake and Sobel's 1992 book, pages 55 to 62; check it against the book or the 2015 Drake, Vakoch and Dowd volume. Tried 2026-10-16 and still open: neither book could be opened (restricted lending copy, no snippets); other secondary accounts give a single 0.5 for 1961 (Glade and colleagues 2012, Table 1; Scoles and Heatherly 2011 in the Astronomical Society of the Pacific's magazine), and the SETI Institute's page says attendees thought the share was close to 100 percent.",
]

notes = "Checked 2026-10-16 against the primary sources: Sagan's one third and the Mayor period limit of 100 days are borne out; Mayor's statistics use 822 stars, not 376 (corrected in the estimate and in a revision below). Drake's 1961 value of 0.2 to 0.5 could not be checked against Drake and Sobel or the 2015 volume tonight: other secondary accounts give a single 0.5 (Glade and colleagues 2012, arXiv:1112.1506, Table 1; the Astronomical Society of the Pacific article by Scoles and Heatherly, 2011), so the 1961 range is still unconfirmed; it has no weight in the range, which rests on the surveys. Saturday session C writes the publication records for the 2012 microlensing paper and the others cited here; when they exist, each estimate gets a 'publication' link to its record. Written 2026-10-16. Outside review, 2026-10-17: the proposal to change the shape to uniform (item 5) was declined for consistency with the other log-uniform ranges, the headline being the same within noise either way (58.7% against 58.8% alone in the galaxy on a scratch copy); the range is unchanged. Ruled by John 2026-10-17."

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
low = 0.2
high = 0.5
source = "Green Bank meeting of November 1961, as recorded in Drake and Sobel, Is Anyone Out There? (Delacorte, 1992), pages 55 to 62, and in Drake, Vakoch and Dowd, The Drake Equation: Estimating the Prevalence of Extraterrestrial Life through the Ages (Cambridge University Press, 2015); the meeting's record is the founding entry of the publications log (drake-1961)"
method = "Educated guess before any planet outside the solar system had been found."

[[estimate]]
who = "Arnaud Cassan and colleagues"
when = "2012-01-12"
low = 0.62
high = 1.0
source = "Cassan et al., 'One or more bound planets per Milky Way star from microlensing observations', Nature 481, 167–169 (2012)"
link = "https://arxiv.org/abs/1202.0903"
method = "Gravitational microlensing over six years of survey data; 62% of stars found to host a planet of a few Earth masses at 0.5 to 10 times the Earth-Sun distance, and the planets per star add to more than one, so the share of stars with any planet lies between the two."

[[estimate]]
who = "Carl Sagan"
when = "1980"
value = 0.33
source = "Sagan, Cosmos (Random House, 1980), chapter 12, 'Encyclopaedia Galactica'"
method = "A round guess, one third, in a worked example of the equation written for a general audience before any exoplanet was known."

[[estimate]]
who = "Michel Mayor and colleagues"
when = "2011-09"
low = 0.5
high = 1.0
source = "Mayor et al., 'The HARPS search for southern extra-solar planets XXXIV. Occurrence, mass distribution and orbital properties of super-Earths and Neptune-mass planets', arXiv:1109.2497 (2011)"
link = "https://arxiv.org/abs/1109.2497"
method = "Eight years of measuring the wobble of 822 Sun-like stars (376 with the HARPS instrument, the rest from an earlier survey with the CORALIE instrument); 51 to 57 percent were found to host at least one planet with an orbit shorter than 100 days (50.6 plus or minus 7.4 percent counting published planets, 57.1 plus or minus 8.0 percent with candidates), after correcting for the planets missed. Planets on longer orbits were not counted, so the share with any planet is higher."

[[estimate]]
who = "Courtney Dressing and David Charbonneau"
when = "2015-07"
low = 0.9
high = 1.0
source = "Dressing and Charbonneau, 'The occurrence of potentially habitable planets orbiting M dwarfs estimated from the full Kepler dataset and an empirical measurement of the detection sensitivity', Astrophysical Journal 807, 45 (2015)"
link = "https://arxiv.org/abs/1501.01623"
method = "Kepler's four-year count of planets crossing red dwarf stars, corrected for the ones it would have missed: 2.5 plus or minus 0.2 planets of one to four Earth radii per red dwarf with orbits under 200 days. Red dwarfs are three quarters of all stars, and with that many planets per star almost every one has at least one; the lower figure here allows for planets bunching around some stars."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 0.1
high = 1.0
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A span evenly spread across its powers of ten, chosen to cover the published argument; the paper notes that 'different methods are converging on fp ≈ 1'."

[range]
low = 0.5
high = 1.0
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-16
sources = ["sandberg-2018"]
why = """
Started on 2026-10-16 from the range Sandberg, Drexler and Ord used in 2018 (0.1 to 1) and
raised the same evening once the full record was read: no survey since 2011 finds fewer than
half of stars with a planet. The microlensing count (Cassan 2012) puts the floor at 0.62 for
the stars it covers; the wobble survey (Mayor 2011) finds more than half of Sun-like stars
with a close planet before counting the distant ones; the Kepler red-dwarf count (Dressing and
Charbonneau 2015) finds two and a half planets per star for the three quarters of stars that
are red dwarfs. The floor is rounded down to 0.5 to leave room for the kinds of star no survey
covers well. Evenly spread across its powers of ten for consistency with the other factors; the
span is so narrow that the shape barely matters."""

[[revision]]
date = 2026-10-16
field = "range.low"
old = 0.1
new = 0.5
why = "The published record read in full the same day the worked example was written: no survey since 2011 finds fewer than half of stars with a planet (Cassan 2012, Mayor 2011, Dressing and Charbonneau 2015). The 2018 paper's floor of 0.1 covered an argument that the surveys have since closed."

[[revision]]
date = 2026-10-16
field = "estimate (Michel Mayor and colleagues, 2011).method"
old = "Eight years of measuring the wobble of 376 Sun-like stars with the HARPS instrument; more than half were found to host at least one planet with an orbit shorter than 100 days, a lower limit since longer orbits and smaller planets were missed."
new = "822 Sun-like stars (376 with HARPS, the rest with CORALIE); 51 to 57 percent host at least one planet with an orbit shorter than 100 days. The estimate's low (0.5) and high (1.0) are unchanged and the range is untouched."
why = "Checked against Mayor et al., arXiv:1109.2497, on 2026-10-16: the statistical sample is 822 stars, and the corrected share is 50.6 plus or minus 7.4 percent (published planets) to 57.1 plus or minus 8.0 percent (with candidates)."

[[revision]]
date = 2026-10-17
field = "range.status"
old = "first-pass"
new = "reviewed"
why = "The outside review of the seven ranges ran on 2026-10-17 and John ruled on every item the same day (docs/reviews/2026-10-17-rulings.md)."
