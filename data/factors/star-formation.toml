# Factor record: R*, how many stars are born in the galaxy each year. Layout in docs/record-schema.md.
# Written 2026-10-16 (Saturday session A, run early at John's ruling). The outside review of the
# seven ranges ran on 2026-10-17 and John ruled on it the same day; this range is "reviewed".

id = "star-formation"
symbol = "R*"
order = 1
name = "How many stars are born in the galaxy each year"
unit = "stars per year"
description = """
The rate at which the Milky Way makes new stars, averaged over the time it takes a star to
grow a civilisation. It is the best-measured factor in the equation: the galaxy's output of
new stars is read from the glow of young stars and the gas they heat, and comes to roughly one
and a half to two solar masses a year, which is three or four stars a year once the many small
stars are counted. The one real argument is over which rate to use: today's, or the higher
average over the galaxy's whole life, since the stars that could host a civilisation today
were mostly born billions of years ago."""
what_would_move_this = "A new measurement of the Milky Way's present star-formation rate, or of its star-formation history, that falls outside one to twenty stars a year."

notes = """
Carl Sagan's version of the equation in Cosmos (1980) replaces this factor with the total number
of stars in the galaxy and asks what fraction of a planet's life a civilisation lasts, so his
numbers do not translate to a rate per year and are not listed here. Westby and Conselice (2020)
likewise work from the galaxy's star-formation history rather than a single rate. Checked
2026-10-16: Robitaille and Whitney's 0.68 to 1.45, Licquia and Newman's 1.65 plus or minus 0.19 and their stellar mass of 6.08 plus or minus 1.14 times ten to the tenth solar masses, and Kennicutt and Evans's mean star mass of 0.5 solar masses are all in the papers' own text. Drake's 1961 value was open on 2026-10-16 (1 a year in one account, 10 in the Cambridge abstract of the star-formation chapter of the 2015 Drake volume and in Glade and colleagues 2012, Table 1); checked on 2026-10-17 against Pearman's 1963 account of the meeting, page 289, which gives 1 a year and says that counting some Population II stars would give values as high as 10, so both accounts are readings of the same meeting and the estimate of 1 stands, with the 10 in its method line. Ruiz-Lara and colleagues (2020, ruiz-lara-2020) was read in full on 2026-10-17: it gives a normalised history and no rate in stars or solar masses a year, and no 'four times'; so no estimate is added (the review's item 3). The Siegert estimate's source line named the wrong paper ('Galactic 26Al traces metal loss through hot chimneys') and now gives the title of the paper the publication record describes. Written
2026-10-16. Outside review, 2026-10-17: the top of the range rose from 10 to 20 (items 2 and 4); the
reviewer's proposal to change the shape to uniform (item 1) was declined because a uniform span from 1
to 20 puts more than half its weight above 10, where one method sits and five do not, whereas the
question is still which power of ten (headline with a uniform shape on a scratch copy: 56% alone in
the galaxy); ruled by John 2026-10-17."""

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
value = 1
source = "Green Bank meeting of November 1961, as reported by Pearman in the first printed account of it (Interstellar Communication, 1963), page 289 (drake-1961)"
method = "Pearman: about 10 to the 10 sun-like stars divided by their lifetime of about 10 to the 10 years, so 1 a year, which he calls perhaps a conservative estimate; counting some older, Population II stars would give values as high as 10 a year."

[[estimate]]
who = "Thomas Robitaille and Barbara Whitney"
when = "2010-02"
low = 1.4
high = 2.9
source = "Robitaille and Whitney, 'The present-day star formation rate of the Milky Way determined from Spitzer-detected young stellar objects', Astrophysical Journal Letters 710, L11 (2010)"
link = "https://arxiv.org/abs/1001.3672"
method = "Counted the young stars the Spitzer space telescope sees across the galactic plane and compared the count with a model of how such stars form and fade; 0.68 to 1.45 solar masses of new stars a year, which is 1.4 to 2.9 stars a year at the usual average of half a solar mass per new star."

[[estimate]]
who = "Timothy Licquia and Jeffrey Newman"
when = "2015-06"
low = 2.9
high = 3.7
source = "Licquia and Newman, 'Improved estimates of the Milky Way's stellar mass and star formation rate from hierarchical Bayesian meta-analysis', Astrophysical Journal 806, 96 (2015)"
link = "https://arxiv.org/abs/1407.1078"
method = "Combined every earlier measurement of the galaxy's star-formation rate, allowing for the chance that any one of them is wrong; 1.65 plus or minus 0.19 solar masses a year, which is 2.9 to 3.7 stars a year at half a solar mass per star."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 1
high = 100
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A deliberately wide span, evenly spread across its powers of ten, meant to cover the whole published argument rather than to measure anything; the paper itself notes that the real uncertainty is about one power of ten."

[[estimate]]
who = "Thomas Siegert and others"
when = "2023-01"
low = 8
high = 16
source = "Siegert and others, 'Galactic Population Synthesis of Radioactive Nucleosynthesis Ejecta', Astronomy and Astrophysics 672, A54 (2023) (siegert-2023)"
link = "https://arxiv.org/abs/2301.10192"
publication = "siegert-2023"
method = "Measured the gamma-ray glow of radioactive aluminium made by massive stars across the galaxy and worked back to how fast stars must be forming to keep it topped up; 4 to 8 solar masses of new stars a year (the paper's figure, in solar masses only), which is 8 to 16 stars a year at half a solar mass per star (this site's conversion; Science News's reading of the paper converted it to 10 to 20). One method, and above the several that agree on 1 to 4; added at John's ruling on 2026-10-16 after the first weekly reading found it."

[[estimate]]
who = "Alexis Quintana and others"
when = "2025-03"
value = 1.3
source = "Quintana and others, 'A census of OB stars within 1 kpc and the star formation and core collapse supernova rates of the Milky Way', Monthly Notices of the Royal Astronomical Society (2025) (quintana-2025)"
link = "https://arxiv.org/abs/2503.08286"
publication = "quintana-2025"
method = "Counted the massive, short-lived stars within about three thousand light years of the Sun and scaled the count to the whole galaxy; 0.67 solar masses a year, which is 1.3 stars a year at half a solar mass per star. Added at John's ruling on 2026-10-16 after the first weekly reading found it."

[range]
low = 1
high = 20
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-17
sources = ["sandberg-2018", "siegert-2023"]
why = """
Narrower than the 2018 paper's 1 to 100: the top of their span is far above any measurement of
this galaxy. Measurements of today's rate (Robitaille and Whitney 2010, Licquia and Newman
2015, Quintana and others 2025) cluster between 1.3 and 3.7 stars a year. The range reaches up
to 20 for two reasons. The stars that could host a civilisation today were mostly born long ago,
when the galaxy made stars faster: spreading its roughly six times ten to the tenth solar masses
of stars over its ten billion years gives an average of about six solar masses, or ten stars, a
year. And the 2023 measurement of the galaxy's aluminium-26 glow (Siegert and others) gives 8 to
16 stars a year, which a range meant to cover the published argument has to hold; it is one
method, and its authors flag a possible foreground that could make the true figure lower, so 20,
a round step, is used rather than 16. Drake's 1961 value of one star a year is the floor, and the
2025 census (1.3) sits just above it. Evenly spread across powers of ten, the same shape the 2018
paper used, because the question is which power of ten, not which digit. The top was 10 until
2026-10-17, when it rose to 20 (ruled by John 2026-10-17 on the outside review, items 2 and 4)."""

[[revision]]
date = 2026-10-16
field = "estimate"
old = "four published estimates"
new = "six published estimates: the 2023 aluminium-26 measurement (8 to 16 stars a year) and the 2025 massive-star census (1.3 a year) added"
why = "The weekly reading of 2026-10-16 found two measurements the record did not carry and flagged the range for John. He ruled on 2026-10-16: add both to the estimate list and leave the range's top at 10 until the outside review of the seven ranges."
publication = "siegert-2023"

[[revision]]
