new = "Drake 1961 source: Pearman (1963), page 289. Siegert 2023 source: titled 'Galactic Population Synthesis of Radioactive Nucleosynthesis Ejecta'"
why = "Checked 2026-10-17 against Pearman's 1963 account of the meeting, the first printed one, which is openly readable at the Internet Archive; the source line now cites it with its page, in place of Drake and Sobel (1992), whose page numbers came from a secondary summary and which has not been read. The estimate's numbers are unchanged. The Siegert source line also gave the title of a different paper; it is corrected to the paper the publication record (siegert-2023) and the Crossref record for A&A 672, A54 describe."
