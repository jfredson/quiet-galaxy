[[revision]]
date = 2026-10-17
field = "estimate"
old = "Drake 1961 source: Drake and Sobel (1992), pages 55 to 62; method named a spread of N of 20 to 50 million"
new = "Drake 1961 source: Pearman (1963), page 292; the spread of N is no longer stated"
why = "Checked 2026-10-17 against Pearman's 1963 account of the meeting, the first printed one, which is openly readable at the Internet Archive; the source line now cites it with its page, in place of Drake and Sobel (1992), whose page numbers came from a secondary summary and which has not been read. The estimate's numbers are unchanged. The clause about a spread of N of 20 to 50 million is removed from the method line: it came from a secondary summary and Pearman's account does not say it in a form that could be read."
publication = "drake-1961"
