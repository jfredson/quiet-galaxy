# Factor record: L, how long a civilisation stays detectable, in years. Layout in docs/record-schema.md.
# Written 2026-10-16 (Saturday session A, run early at John's ruling). The outside review of the seven ranges ran on 2026-10-17 and John ruled on it
# the same day; this range is "reviewed".

id = "lifetime"
symbol = "L"
order = 7
name = "How long a civilisation stays detectable, in years"
unit = "years"
description = """
Once a civilisation becomes detectable, how many years it stays that way before it dies out,
falls silent or changes into something we would not recognise. Multiplied by the rate at which
civilisations appear, this gives how many are detectable at any one moment, which is why Drake's
1961 meeting concluded that N is roughly equal to L. Our own technological civilisation has been
detectable for about a century. The published figures run from a few hundred years, read off
the lifetimes of historical empires, to billions of years for a civilisation that spreads
beyond its home planet; the gap between them is the single widest in the equation after the
chance of life starting."""
what_would_move_this = "A published argument with a number on how long technological civilisations last (from history, from risk studies of our own prospects, or from the physics of long-lived machines), or a detection whose age bounds it."

verify = [
  "David Grinspoon's 'potentially billions of years' is quoted from the Wikipedia article, which cites Lonely Planets (2004); check the book, and whether a billion is his figure or the article's rounding. Tried 2026-10-16 and still open: the Internet Archive copy is not readable (lending only) and Google Books refused the query. Second-hand only: a Drake-equation paper (arXiv:1705.07816) says Grinspoon replaces the factor by the share of civilisations that become immortal times how long that has been going on, which 'may approach the age of the universe'; so the structure in the method line holds, but a figure of one billion is not confirmed, and the book's first publication was 2003 (the record says 2004, the paperback).",
]

notes = """
Westby and Conselice (2020, westby-2020) make this the deciding factor explicitly: taking our own
century as the average lifetime of a communicating civilisation, and life and intelligence as
following on any suitable planet, they get at least 36 (between 4 and 211) communicating
civilisations in the galaxy, the nearest at most about 17,000 light-years away, which is to say far
beyond the reach of any present search. Their weaker assumption (intelligence at any age after 5
billion years; the paper's 'Weak Copernican' case) gives 928 civilisations, the nearest at most about 3,300
light-years away. They say a search is expected to succeed if civilisations last on average
about 3,060 years under the strong condition and about 1,030 years under the weak one (read
from the arXiv version of the paper, 2026-10-16). Checked 2026-10-16 against the primary
sources: Shermer's two figures are in his column (reprinted on his own site); Grinspoon's could
not be checked (see the open item above). The 'they are gone' family of explanations (the Great
Filter ahead of us, Hanson 1998, hanson-1998; self-destruction) are arguments that this factor
is short; the founding pessimist papers (Hart 1975, hart-1975; Tipler 1980, tipler-1980) argue
instead that no civilisation has lasted long enough to spread here, which bounds this factor and
the previous one together. The 2018 paper cuts its span off at ten billion years because a
civilisation older than the galaxy cannot have appeared at a steady rate. Written 2026-10-16. Outside review, 2026-10-17, ruled by John the same day: lowering the floor from 100 to 10 years (item 18) was declined, narrowly: the only measured case, ours, has been detectable for about ninety years and counting, and the figures below a century are arguments and not measurements. Garrett (2025, garrett-2025) argues the detectable phase may last 'mere decades'; it is now in the estimate list (item 19) with the span of 10 to 100 years as how 'decades' reads, the paper giving no number of its own. To revisit if a paper gives a figure below 100 with a method behind it. Rahvar and Rouhani (2026, rahvar-2026) stay in the log and linked from this factor but are not an estimate (item 20): their 5,000 years is an upper bound derived from the silence if the other six factors are generous, and using it would count the silence twice."""

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
low = 1000
high = 100000000
source = "Green Bank meeting of November 1961, as reported by Pearman in the first printed account of it (Interstellar Communication, 1963), page 292 (drake-1961)"
method = "Pearman: the distribution of lifetimes might have two humps, societies that destroy themselves within, say, less than a thousand years and others that last for periods of the order of hundreds of millions of years; the record's 1,000 to 100,000,000 is those two ends, rounded. The account says the lifetime has a decisive influence on the number of civilisations."

[[estimate]]
who = "J. Richard Gott"
when = "1993-05"
low = 5100
high = 7800000
source = "Gott, 'Implications of the Copernican principle for our future prospects', Nature 363, 315–319 (1993)"
link = "https://www.nature.com/articles/363315a0"
method = "Reasoned that we are unlikely to be observing our species at an unusual moment of its history: given about 200,000 years so far, the human species should last between 5,100 and 7.8 million more years with 95% confidence. A statement about our species, not about its detectable phase, recorded because it is the best-known attempt to put a number on how long we have."

[[estimate]]
who = "Michael Shermer"
when = "2002-08"
low = 304
high = 420
source = "Shermer, 'Why ET hasn't called', Scientific American 287(2), 21 (2002)"
method = "Averaged the recorded lifetimes of sixty historical civilisations on Earth, 420 years, and of the twenty-eight since the fall of Rome, 304 years (the column gives 420.6 and 304.5), and took that as the likely lifetime of a technological civilisation."

[[estimate]]
who = "David Grinspoon"
when = "2004"
value = 1000000000
source = "Grinspoon, Lonely Planets: The Natural Philosophy of Alien Life (HarperCollins, 2004)"
method = "Argued that a civilisation which survives its first dangerous centuries may become effectively immortal, so that the factor should be replaced by the share of civilisations that become immortal times the age of the galaxy; a billion years is the figure the argument reaches."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 100
high = 10000000000
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A span evenly spread across its powers of ten, from the published estimates (which they read as 50 years to ten billion), cut off at the age of the galaxy because the equation assumes civilisations appear at a steady rate."

[[estimate]]
who = "Tom Westby and Christopher Conselice"
when = "2020-06"
value = 100
source = "Westby and Conselice, 'The Astrobiological Copernican Weak and Strong Limits for Intelligent Life', Astrophysical Journal 896, 58 (2020) (westby-2020)"
link = "https://arxiv.org/abs/2004.03968"
method = "Assumed: the average lifetime of a communicating civilisation is taken to be 100 years, 'based on our own at present', and their count of 36 scales with it."

[[estimate]]
who = "Michael Garrett"
when = "2025-09"
low = 10
high = 100
source = "Garrett, 'Blink and you'll miss it: How Technological Acceleration Shrinks SETI's Narrow Detection Window', arXiv:2509.23632 (2025), accepted by Acta Astronautica (garrett-2025)"
link = "https://arxiv.org/abs/2509.23632"
publication = "garrett-2025"
method = "Argued from a simple model that a civilisation whose technology accelerates fast, as a machine-based one might, passes through the phase in which we could detect it in 'mere decades' (the paper's abstract); the paper gives no number in its abstract, and 10 to 100 years is how 'decades' is read here. Added on 2026-10-17 (outside review, item 19); it lies below the range's floor of 100, which item 18 left where it is."

[range]
low = 100
high = 10000000000
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-16
sources = ["sandberg-2018"]
why = """
The 2018 paper's span of 100 to ten billion years, kept as it is. The floor is Westby and Conselice's century, which is how long our own civilisation has been detectable so far; Shermer's three to four hundred years sits just above it. Garrett's 'mere decades' (2025) is shorter, but it is a model of what might happen to a machine-based civilisation and not a measurement, and the one measured case has already lasted about ninety years, so the floor was left at 100 (ruled by John 2026-10-17 on the outside review, item 18). The ceiling is the age of the galaxy, past which the equation's assumption of a steady rate of appearance breaks down, and it covers Grinspoon's billion years and Drake's hundred million. Evenly spread across its powers of ten because nothing favours any power of ten between the two: the argument is between 'civilisations burn out' and 'civilisations become permanent', and both are published."""

[[revision]]
date = 2026-10-17
field = "range.why"
old = "The floor is the shortest published figure, Westby and Conselice's century"
new = "The floor is Westby and Conselice's century; Garrett's 'mere decades' is shorter but is a model and not a measurement, so the floor stays"
why = "Ruled by John 2026-10-17 on the outside review (item 18, declined): the old wording called the century the shortest published figure, which stopped being true once Garrett's paper (2025) was added as an estimate. The range itself is unchanged."
publication = "garrett-2025"

[[revision]]
date = 2026-10-17
field = "estimate"
old = "six published estimates"
new = "seven: Garrett (2025), 10 to 100 years, added"
why = "Ruled by John 2026-10-17 on the outside review (item 19). Rahvar and Rouhani's 5,000-year bound (item 20) was declined as an estimate and stays in the log. The range is unchanged."
publication = "garrett-2025"

[[revision]]
