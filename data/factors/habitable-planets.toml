new = "Said that, after allowing for how common planets are and for the location and lifetime of the habitable zone, the ordinary Drake equation suggests only 1% to 0.001% of stars might have such planets; their further extras come later and are not in the figure. Source page corrected from 270 to 269-270. The estimate's numbers and the range are unchanged."
why = "Checked against Rare Earth (Copernicus, 2000), pages 269 to 271, on 2026-10-16: the figure is their reading of the ordinary equation, not of the extras."
