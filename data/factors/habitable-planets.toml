# Factor record: ne, planets per star that could support life. Layout in docs/record-schema.md.
# Written 2026-10-16 (Saturday session A, run early at John's ruling). The outside review of the seven ranges ran on 2026-10-17 and John ruled on it
# the same day; this range is "reviewed".

id = "habitable-planets"
symbol = "ne"
order = 3
name = "Planets per star that could support life"
unit = "planets per star"
description = """
For a star with planets, how many of them could support life: in practice, how many rocky
planets of roughly Earth's size orbit where water could be liquid on the surface. The Kepler
mission turned this from a guess into a measurement for Sun-like stars and for red dwarfs,
with the answer coming out between a tenth and one such planet per star. What the surveys
cannot count is whether such a planet also has the other things Earth has, such as a large
moon, moving continents and a quiet neighbourhood, which is where the argument over this
factor now lives."""
what_would_move_this = "A new count of rocky planets in the habitable zone per star from Kepler, TESS, Gaia or PLATO data, or a measurement of how often such planets keep an atmosphere and liquid water (the TRAPPIST-1 and K2-18b results bear on this)."

notes = """
Lineweaver, Fenner and Gibson (Science, 2004) argued that only about a tenth of the galaxy's
stars sit in a 'galactic habitable zone' with enough heavy elements and few enough nearby
supernovae for complex life; that is a multiplier on this factor rather than an estimate of
it, and the surveys above count planets without it. The Rare Earth argument (Ward and Brownlee
2000, ward-2000) is written up as an explanation in its own right; its number is recorded here
because it is the published pessimistic extreme. Checked 2026-10-16: the 1% to 0.001% is Ward and Brownlee's reading of the ordinary equation, before their further extras (pages 269 to 270; the extras come on page 271), so the range's reason below, which describes the one-in-a-hundred-thousand end as resting on the extras, was written before this was checked and should be revisited at the outside review; the range itself is unchanged. Drake's 1961 range of 1 to 5 was checked on 2026-10-17 against Pearman's 1963 account of the meeting, page 290: 'For the galaxy in general a value for n_e of 1 to 5 was postulated'; the secondary accounts that give a single 2 (Glade and colleagues 2012, Table 1; Scoles and Heatherly 2011) or 'approximately one' (SETI Institute) are other readings of the same meeting. Written 2026-10-16. Outside review, 2026-10-17: the proposal to lower the floor from 0.01 to 0.00001 to match Ward and Brownlee (item 7) was declined and the reason in the range rewritten, as this note had asked; the headline at 0.00001 on a scratch copy was 69% alone in the galaxy against 59%. Ruled by John 2026-10-17."""

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
low = 1
high = 5
source = "Green Bank meeting of November 1961, as reported by Pearman in the first printed account of it (Interstellar Communication, 1963), page 290 (drake-1961)"
method = "Pearman calls it a matter of pure guesswork. For the solar system he reports at least 2 (Earth and Mars), and possibly one of the major planets if methane and ammonia warm it by the greenhouse effect; for the galaxy in general the meeting postulated 1 to 5."

[[estimate]]
who = "Carl Sagan"
when = "1980"
value = 2
source = "Sagan, Cosmos (Random House, 1980), chapter 12, 'Encyclopaedia Galactica'"
method = "A round guess in a worked example of the equation for a general audience, before any exoplanet was known."

[[estimate]]
who = "Peter Ward and Donald Brownlee"
when = "2000"
low = 0.00001
high = 0.01
source = "Ward and Brownlee, Rare Earth: Why Complex Life Is Uncommon in the Universe (Copernicus, 2000), pages 269 to 270, chapter 'Assessing the Odds' (ward-2000)"
method = "Said that, after allowing for how common planets are and for the location and lifetime of the habitable zone, the ordinary Drake equation suggests that only between 1% and 0.001% of all stars might have planets with habitats similar to Earth's, and that even these numbers are probably too high. They also ruled out red dwarfs as hosts. Their further extras (a large moon, plate tectonics, few mass extinctions) come after this passage and are not counted in the figure. Taken here as planets per star, since nearly every star has planets."

[[estimate]]
who = "Erik Petigura, Andrew Howard and Geoffrey Marcy"
when = "2013-11"
low = 0.14
high = 0.30
source = "Petigura, Howard and Marcy, 'Prevalence of Earth-size planets orbiting Sun-like stars', Proceedings of the National Academy of Sciences 110, 19273–19278 (2013)"
link = "https://arxiv.org/abs/1311.6806"
method = "Kepler's count of planets crossing 42,000 Sun-like stars, corrected for the planets it would have missed by injecting fake ones into the data: 22 plus or minus 8 percent of Sun-like stars have a planet of one to two Earth radii receiving between a quarter and four times the light Earth gets (the paper's abstract gives the directly measured 11 plus or minus 4 percent for one to four times the light Earth gets; the 22 percent extends that down to a quarter, assuming equal numbers of planets in each step of the logarithm of the light received)."

[[estimate]]
who = "Courtney Dressing and David Charbonneau"
when = "2015-07"
low = 0.09
high = 0.33
source = "Dressing and Charbonneau, 'The occurrence of potentially habitable planets orbiting M dwarfs estimated from the full Kepler dataset and an empirical measurement of the detection sensitivity', Astrophysical Journal 807, 45 (2015)"
link = "https://arxiv.org/abs/1501.01623"
method = "Kepler's count of planets crossing red dwarf stars, the most common kind, corrected for the ones it would have missed: 0.16 (between 0.09 and 0.33) Earth-size planets per red dwarf in the strictly defined habitable zone, plus another 0.12 planets somewhat larger than Earth; the wider habitable zone that allows for early Venus and early Mars gives 0.24 and 0.21."

[[estimate]]
who = "Danley Hsu, Eric Ford, Darin Ragozzine and Keir Ashby"
when = "2019-08"
low = 0.03
high = 0.40
source = "Hsu, Ford, Ragozzine and Ashby, 'Occurrence Rates of Planets Orbiting FGK Stars: Combining Kepler DR25, Gaia DR2, and Bayesian Inference', Astronomical Journal 158, 109 (2019) (hsu-2019)"
link = "https://arxiv.org/abs/1902.01417"
publication = "hsu-2019"
method = "Kepler's final planet catalogue combined with Gaia's measurements of the stars: for planets of 0.75 to 1.5 Earth radii on orbits of 237 to 500 days around Sun-like stars, a rate of less than 0.27 per star, which could be lower by a factor of about two because some candidates are false alarms; the authors recommend planning for a true rate anywhere from 0.03 to 0.40, which is the span used here. Added on 2026-10-17 (outside review, item 8)."

[[estimate]]
who = "Steve Bryson and 81 colleagues (the Kepler team)"
when = "2020-11"
low = 0.16
high = 1.5
source = "Bryson et al., 'The occurrence of rocky habitable zone planets around solar-like stars from Kepler data', Astronomical Journal 161, 36 (2021); posted 2020-10-28 (bryson-2020)"
link = "https://arxiv.org/abs/2010.14812"
method = "The Kepler mission's final planet catalogue combined with Gaia's measurements of the stars, corrected for what the catalogue missed and for false detections: between 0.37 (0.16 to 0.85) and 0.60 (0.24 to 1.50) planets of half to one and a half Earth radii per Sun-like star in the strictly defined habitable zone, the two figures reflecting two ways of extrapolating to orbits Kepler could not see; the generous habitable zone gives 0.58 to 0.88. The nearest such planet is estimated to be about 20 light-years away."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 0.1
high = 1.0
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A span evenly spread across its powers of ten, taking an Earth-like planet to mean a rocky planet in the habitable zone; the paper notes that the published argument runs from below one in a trillion (the Rare Earth case) to more than one (counting icy moons)."

[range]
low = 0.01
high = 1.0
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-16
sources = ["sandberg-2018", "ward-2000"]
why = """
The Kepler counts (Petigura 2013, Dressing and Charbonneau 2015, Hsu and others 2019, Bryson 2020)
put rocky planets in the habitable zone at between a tenth and one per star for both Sun-like
stars and red dwarfs, with the most careful study's error bars reaching one and a half. The top of
the range is 1, as in the 2018 paper. The floor is a tenth of theirs, 0.01, to leave room for the
requirements the surveys cannot count: a planet in the right orbit is not yet a planet that keeps
liquid water for billions of years, and the TRAPPIST-1 atmosphere results of 2023 to 2025 show rocky
planets around red dwarfs can lose their air. It stops at 0.01 and does not follow Ward and
Brownlee down to one in a hundred thousand, and the reason is not that their figure rests on the
extras: it does not. Their one percent to one thousandth of a percent (Rare Earth, 2000, pages 269
to 270) is the share of all stars with an Earth-like habitat, their own reading of the ordinary
equation, written before any count of habitable-zone planets existed. The Kepler counts since have
overtaken the part of it that counts orbits, and what survives of Rare Earth is the argument about
extras (a large moon, plate tectonics, a quiet neighbourhood), which is an argument and not a count,
and which the explanation page carries. Evenly spread across powers of ten, as in the 2018 paper.
The reason was rewritten on 2026-10-17 (ruled by John 2026-10-17 on the outside review, item 7); the
number was not changed."""

