# Factor record: fi, the share of planets with life on which it becomes intelligent.
# Layout in docs/record-schema.md. Written 2026-10-16 (Saturday session A, run early at John's
# ruling). The outside review of the seven ranges ran on 2026-10-17 and I ruled on it
# the same day; this range is "reviewed".

id = "intelligence"
symbol = "fi"
order = 5
name = "The share of planets with life on which it becomes intelligent"
unit = "fraction"
description = """
Given a planet with life, how likely it is that some of that life eventually becomes
intelligent in the sense that matters here: able to build technology. On Earth it took about
four billion years, most of it spent as single cells, and happened in one lineage out of
billions of species, which the biologist Ernst Mayr took as proof that it is a fluke. Others
read the steady rise in the complexity of life as a sign that intelligence is close to
inevitable given time. There is no second example, and the only new evidence is statistical:
reasoning from how late in Earth's habitable life we arrived."""
what_would_move_this = "A second example of complex or intelligent life anywhere, a change in the fossil record's timeline for the major steps (complex cells, animals, brains), or a published analysis that puts a new number on how often intelligence follows from life."

notes = """
Kipping's 2020 Bayesian analysis (kipping-2020) found a weak preference, three-to-two, for
intelligence rarely emerging, from the fact that it took almost all of Earth's habitable
lifetime to appear; the paper strongly excludes intelligence arising quickly (in much less than
a billion years) on an Earth-like world, and gives no single value for this factor. Frank and
Sullivan (2016, Astrobiology 16, 359) turned the question round: for Earth to be the only
technological species ever in the observable universe, the combined chance of life, intelligence
and technology per habitable planet would have to be below 2.5 in ten to the 24, and below 1.7
in ten to the 11 for the galaxy. Hanson and colleagues' 2021 'grabby aliens' model
(hanson-2021-grabby) constrains the product of this factor and the next from the other end: if
expanding civilisations exist and we are early among them, quiet civilisations that never expand
can be at most a few thousand times as common as loud ones, else we would have seen a loud one
by now. Checked 2026-10-16 against the sources: Carl Sagan's one tenth was removed (Cosmos,
chapter 12, gives only the product of this factor and the next, one in a hundred); Mayr's point
value of one in a billion was replaced by the span his own counts give, 2 in 100 billion to 1 in a
billion (the range is unchanged, and its floor of 0.0001 stays well above it); Westby and
Conselice's assumption of 1 is borne out (their section 2.2; the strong version only requires
4.5 to 5.5 billion years). Lineweaver (2009, 'Paleontological tests: human-like intelligence is not a
convergent feature of evolution', in From Fossils to Astrobiology, arXiv:0711.1751) argues from the
fossil record that human-like intelligence is not convergent, and gives no number, so it is not an
estimate; the 'Planet of the Apes' label belongs to the opposite view, which he argues against.
Written 2026-10-16. Pascal Lee's estimate was checked on 2026-10-17 against the two recorded talks, which are on YouTube (Mt Tam Astronomy channel, published 2020-10-24, https://www.youtube.com/watch?v=cuJDkIUuDBg; Kalamazoo Astronomical Society channel, published 2021-03-06, https://www.youtube.com/watch?v=wj5nmgoQr50), by reading their automatic captions: in both he derives the figure from the time since Homo erectus (about a million years) against the age of Earth, and says it comes to about two ten-thousandths (the second talk's captions write it 0.00002, but the same sentence says two ten-thousandths of one, which is 0.0002), and Centauri Dreams reported the same derivation on 2023-10-18 (https://www.centauri-dreams.org/2023/10/18/galactic-civilizations-does-n1/). The record had said 'the first humans'; the correction is in the method line. Outside review, 2026-10-17, I ruled the same day: lowering the floor from 0.0001 to one in 10 billion or below, to include the hard-steps conclusions (item 12), was declined. The hard-steps papers (Carter 1983; Snyder-Beattie and colleagues 2021) conclude that intelligence is rare but give no chance per planet, so there is no published number to put the floor at; the only published figure below 0.0001 is Mayr's count of species, which is kept above and not used. Worth keeping visible because the floor is the one place the site's judgment, not a measurement, decides the headline: at one in 10 billion the chance we are alone in the galaxy would be 77% (scratch copy) against 59%, and if the published pessimist is to be covered the principled step is Mayr's top, one in a billion (75%), not one in 10 billion. The reviewer's suggestion to add Barrow and Tipler (1986) as an estimate (item 13) was declined: no source a reader can open was found for the figure attributed to them (searched 2026-10-17; the book is not freely readable and the only open pages found discuss a different formula), so the claim is removed from this record, and a figure for the chance of one particular genome would not in any case be a chance of intelligence per living planet. A survey of living planets against a silent sky (item 14) bounds this factor only together with its neighbours and is not added to the test line."""

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
value = 1
source = "Green Bank meeting of November 1961, as reported by Pearman in the first printed account of it (Interstellar Communication, 1963), page 291 (drake-1961)"
method = "Pearman: a value of about unity was postulated, on the view that intelligence has high enough adaptive value for its eventual selection to be very likely, with some appeal to the sun and solar system being unexceptional; the intelligence of dolphins was noted as suggesting it may not be a very unlikely event."

[[estimate]]
who = "Ernst Mayr"
when = "1995"
low = 2e-11
high = 1e-9
source = "Mayr, 'Can SETI Succeed? Not Likely', Bioastronomy News 7(3) (1995), and his reply to Carl Sagan, reprinted by The Planetary Society as 'Ernst Mayr on SETI' (text read in a blog reproduction on 2026-10-16; the Planetary Society page was not reached). Mayr gives a count, not a chance: the span here is our reading of it"
method = "Argued from the fossil record: of the billions of species that have lived on Earth, perhaps as many as 50 billion, exactly one developed the kind of intelligence that builds radio telescopes, so the chance per planet is read as between one in 50 billion and one in a billion. A count of species, not of planets, which is why it is recorded but not used for the range's floor."

[[estimate]]
who = "Simon Conway Morris, as reviewed by Campbell"
when = "2005"
value = 1
source = "Conway Morris, Life's Solution: Inevitable Humans in a Lonely Universe (Cambridge University Press, 2003), as reviewed by Campbell, 'Human-like intelligence is inevitable' (2005); and Bonner, The Evolution of Complexity by Means of Natural Selection (Princeton, 1988)"
method = "Argued that evolution keeps finding the same solutions (eyes, flight, social behaviour) so that something like human intelligence is close to inevitable wherever complex life has time; a direction rather than a value, recorded as 'approaching 1'."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 0.001
high = 1.0
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A span evenly spread across its powers of ten, taken from the published estimates of 0.001 to 1, with the paper's note that this treats the previous factor as the chance of 'evolutionarily competent' life rather than life of any kind."

[[estimate]]
who = "Tom Westby and Christopher Conselice"
when = "2020-06"
value = 1
source = "Westby and Conselice, 'The Astrobiological Copernican Weak and Strong Limits for Intelligent Life', Astrophysical Journal 896, 58 (2020) (westby-2020)"
link = "https://arxiv.org/abs/2004.03968"
method = "Assumed: in their approach intelligence follows on any planet with life after four and a half to five and a half billion years, as on Earth."

[[estimate]]
who = "Pascal Lee"
when = "2020-10"
value = 0.0002
source = "Lee, 'N ~ 1: Alone in the Milky Way', talk to the Mount Tamalpais astronomy programme, 2020-10-24, and to the Kalamazoo Astronomical Society, 2021-03-06"
method = "Took the one million years since Homo erectus, whom he defines as the first intelligent creature on Earth, against the age of Earth (4.6 billion years in the talks) as the share of a planet's life during which intelligence has been present, about two ten-thousandths, and read it as the chance that intelligence appears on a planet where life has. In the same talks he gives 0.1 for the detectable factor."

[range]
low = 0.0001
high = 1.0
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-16
sources = ["sandberg-2018"]
why = """
Starts from the 2018 paper's span of 0.001 to 1, which they took from the published estimates,
and lowers the floor one power of ten to 0.0001 so that Pascal Lee's 0.0002 falls inside it.
The top is 1, Drake's and Westby and Conselice's assumption and Conway Morris's direction of
travel. Mayr's one in a billion is recorded but not used for the floor: it counts species, not
planets, and no one has turned it into a chance per living world. Kipping's weak three-to-two
for 'intelligence is rare' argues against bunching the weight at the top but does not say how far
down to go. Evenly spread across its powers of ten, as in the 2018 paper."""

[[revision]]
date = 2026-10-16
field = "estimate (Carl Sagan, 1980)"
old = "value 0.1, 'a round guess, one tenth'"
new = "removed"
why = "Checked against Cosmos (1980), chapter 12, on 2026-10-16: Sagan writes 'let us choose fi x fc = 1/100' and gives no value for the intelligence factor alone. The range is untouched."

[[revision]]
date = 2026-10-16
field = "estimate (Ernst Mayr, 1995)"
old = "value 1e-9 (the Wikipedia article's rendering)"
new = "low 2e-11, high 1e-9"
why = "Checked on 2026-10-16 against a reproduction of Mayr's essay and reply: he counts billions of species, perhaps as many as 50 billion, one of them intelligent, and gives no chance of his own. The range is untouched (its floor is 0.0001); the published pessimistic extreme in the headline's estimate table moves with this."

[[revision]]
date = 2026-10-17
field = "range.status"
old = "first-pass"
new = "reviewed"
why = "The outside review of the seven ranges ran on 2026-10-17 and I ruled on every item the same day (docs/reviews/2026-10-17-rulings.md)."

[[revision]]
date = 2026-10-17
field = "estimate"
old = "Drake 1961 source: Drake and Sobel (1992), pages 55 to 62"
new = "Drake 1961 source: Pearman (1963), page 291"
why = "Checked 2026-10-17 against Pearman's 1963 account of the meeting, the first printed one, which is openly readable at the Internet Archive; the source line now cites it with its page, in place of Drake and Sobel (1992), whose page numbers came from a secondary summary and which has not been read. The estimate's numbers are unchanged. The method line now gives the account's reasoning."

[[revision]]
date = 2026-10-17
field = "estimate"
old = "Lee method: a million years since the first humans"
new = "Lee method: a million years since Homo erectus, defined by him as the first intelligent creature"
why = "Checked 2026-10-17 against the recordings of his talks of 2020-10-24 and 2021-03-06, in which he takes the time since Homo erectus, not since the first humans. The estimate's number is unchanged."
