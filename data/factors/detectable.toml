# Factor record: fc, the share of intelligent species that make themselves detectable.
# Layout in docs/record-schema.md. Written 2026-10-16 (Saturday session A, run early at John's
# ruling). The outside review of the seven ranges ran on 2026-10-17 and John ruled on it
# the same day; this range is "reviewed".

id = "detectable"
symbol = "fc"
order = 6
name = "The share of intelligent species that make themselves detectable"
unit = "fraction"
description = """
Given an intelligent species, how likely it is to do something we could notice from here:
leak or send radio, light up its planet, change its atmosphere, build things in space. Drake
had deliberate radio messages in mind; the modern reading is broader, since our own radar,
television and city lights have made Earth detectable to a neighbour with a good enough
telescope without our choosing it. The factor also covers the choice not to be found, which is
where several of the explanations for the silence live. Nothing here is measured; every figure
is an assumption."""
what_would_move_this = "A published argument with a number on how often technological species stay quiet or go dark and that isolates this factor; survey limits on how many transmitters or technological signatures could be nearby (the Breakthrough Listen limits) are logged here too, but they bound the product of all seven factors and move this range only together with such an argument."

notes = """
The founding pessimist papers, Hart (1975, hart-1975) and Tipler (1980, tipler-1980), do not
estimate this factor; they argue from the absence of visitors and of self-copying probes that
no detectable civilisation exists in the galaxy at all, and Brin's 1983 survey of the silence
(brin-1983) collects the answers. Those are explanations and are written up as such. Tarter (2001, page 544)
notes that searches at today's sensitivity could detect the equivalent of strong television
transmitters at 1 light-year, military radars at 300 and the Arecibo planetary radar at 3,000,
so by the broad reading this factor is at least the share of species that reach
our level of technology and do not hide. Corrected 2026-10-16 against the sources: Carl Sagan's one tenth was removed (his
Cosmos, chapter 12, gives only the product of the intelligence and detectable factors, one in a
hundred, never this factor alone; see the revision below); Forgan and Elvis (2011) is a paper on
asteroid mining as evidence of aliens and says nothing about Earth being detectable, so it is
dropped; and the range's reason below still names 'Sagan's one in ten' and should be revisited at
the outside review (the range is unchanged). Written 2026-10-16. Outside review, 2026-10-17, ruled by John the same day: lowering the floor from 0.01 to 0.0001 (item 15) was accepted only if De Visscher (2020, de-visscher-2020) gives a range reaching 0.0001 for this factor, and the condition was not met, so the floor stays at 0.01. The paper does print 0.0001 to 1, but for a different quantity: the chance that an intelligent biological species goes on to build a machine intelligence able to communicate across space, which the author sets by assuming the extra step is as selective as the first, so that it is the first one squared. For the biological route, this factor's own subject, the paper takes the 2018 paper's 0.01 to 1 as it stands, which is the range used here. The figure is an assumption for a different thing, and it cannot lower the floor of a share that is already counted over either route (at 0.0001 the scratch headline was 65% alone in the galaxy against 59%). If John reads the paper otherwise, the change is one line and a revision. The reviewer's second paper (item 16), Shostak's chapter 12 in the 2015 Cambridge volume, is in the log (shostak-2015) with its figure left out because the chapter could not be read. The test line was reworded to say survey limits are logged but move the range only with an argument that isolates this factor (item 17)."""

[[estimate]]
who = "Frank Drake and the Green Bank meeting"
when = "1961"
low = 0.1
high = 0.2
source = "Green Bank meeting of November 1961, as reported by Pearman in the first printed account of it (Interstellar Communication, 1963), page 291 (drake-1961)"
method = "Pearman: about 0.2 of intelligent cultures reach the communicative state, from counting between one and five independent attempts on Earth at large-scale social organisation, one of which has got there (an argument the meeting called vulnerable and anthropocentric); whether such a society would be interested in signalling is conjecture, and 0.1 to 0.2 was suggested."

[[estimate]]
who = "Anders Sandberg, Eric Drexler and Toby Ord"
when = "2018-06"
low = 0.01
high = 1.0
source = "Sandberg, Drexler and Ord, 'Dissolving the Fermi Paradox', arXiv:1806.02404 (2018), Table 1 (sandberg-2018)"
link = "https://arxiv.org/abs/1806.02404"
method = "A span evenly spread across its powers of ten, from the published estimates of 0.01 to 1, with the paper's remark that a broader range is clearly intended by some authors."

[[estimate]]
who = "Tom Westby and Christopher Conselice"
when = "2020-06"
value = 1
source = "Westby and Conselice, 'The Astrobiological Copernican Weak and Strong Limits for Intelligent Life', Astrophysical Journal 896, 58 (2020) (westby-2020)"
link = "https://arxiv.org/abs/2004.03968"
method = "Assumed: every civilisation that develops as ours did is taken to be communicating, for an average of 100 years."

[[estimate]]
who = "Alex De Visscher"
when = "2020-06"
low = 0.01
high = 1.0
source = "De Visscher, 'Artificial versus biological intelligence in the Cosmos: clues from a stochastic analysis of the Drake equation', International Journal of Astrobiology 19(5), 353-359 (2020) (de-visscher-2020)"
link = "https://arxiv.org/abs/2001.11644"
publication = "de-visscher-2020"
method = "For intelligent biological species able to communicate across space, took the 2018 paper's span of 0.01 to 1 as it stands, so it is not an independent estimate. The paper also assumes 0.0001 to 1 for the further chance that such a species builds a machine intelligence able to communicate, as the first chance squared; that is a figure for a different thing and is not used here. Added on 2026-10-17 (outside review, item 16)."

[range]
low = 0.01
high = 1.0
shape = "log-uniform"
status = "reviewed"
set_on = 2026-10-16
sources = ["sandberg-2018"]
why = """
The 2018 paper's span of 0.01 to 1, kept as it is: it covers Drake's one in ten to one in five,
Sagan's one in ten and Westby and Conselice's 1, and nothing has been measured that would move
either end. The floor of 0.01 allows for species that never build radio, or build it and stay
quiet, which several explanations (the dark forest, the zoo hypothesis) say is the norm. Evenly
spread across its powers of ten, as in the 2018 paper."""

