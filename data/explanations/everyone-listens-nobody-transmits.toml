id = "everyone-listens-nobody-transmits"
name = "Everyone listens and nobody transmits: if every civilisation makes the same cautious choice we have made, the galaxy is full of ears and empty of voices"
family = "unseen"
proposed_by = "Alexander Zaitsev"
proposed_in = 2006
proposed_source = "'The SETI Paradox', arXiv:physics/0611283 (2006)"
summary = """
Humanity has spent sixty years listening for signals from other civilisations and almost
no effort sending any; the handful of deliberate messages ever transmitted add up to a
few hours. The reasons are familiar: sending is expensive, the reply would take centuries,
and some people think announcing ourselves is dangerous. If every civilisation reasons
the same way, every one of them is sitting in silence waiting for someone else to speak
first. The Russian radio astronomer Alexander Zaitsev called this the SETI paradox,
after the usual name for the search (SETI, the search for extraterrestrial
intelligence): a search that assumes others transmit, run by a species that does not. The silence would
then be a coordination failure on a galactic scale."""
body = """
Alexander Zaitsev was one of the few people who ever sent deliberate messages toward
other stars, from the large radar dish at Yevpatoria in Crimea, in 1999, 2001, 2003 and
2008. He was also the sharpest critic of the asymmetry at the heart of the search. In a
2006 paper he pointed out that the search for extraterrestrial intelligence rests on an
assumption its own practitioners decline to satisfy: that somewhere out there a
civilisation has decided to transmit, steadily and strongly, for long enough to be found.
Humanity, which has the means, has chosen not to, for reasons that range from cost to
caution to the view that the decision should not be made by a few astronomers. If those
reasons are good, they are good for everyone, and a galaxy of civilisations each as
sensible as ours would be entirely silent while every one of them listened.

The argument is a cousin of the dark forest and the zoo but needs neither fear nor
policy. It needs only that transmitting is a cost with no return within any planner's
horizon, which is simply true: a message to a star a thousand light-years away gets a
reply, at best, two thousand years later. Institutions do not fund projects with
two-thousand-year payoffs. Private individuals occasionally do, which is why the few
messages that have been sent were sent by enthusiasts, and why they were short.

The bearing on the Drake Equation is on the share of intelligent civilisations that are
detectable, which this view lowers for the whole class of civilisations that are at or
near our own level: they do not transmit on purpose, and the accidental leakage from
their broadcasting is weak and brief. It makes no claim about civilisations far older
than ours, which might have other reasons or none.

The objections: leakage is not nothing, and a civilisation a few decades ahead of us
might be loud by accident in ways we would catch, though Earth's own leakage is falling as
broadcasting moves to cables and aimed beams; a civilisation that lasts a long time will
eventually have members who transmit, since humanity already has; and the argument
explains the absence of deliberate beacons but not the absence of settlement, which was
Hart's point and which no choice about transmitting affects. Zaitsev's reply was practical:
if the silence is a coordination problem, the way to find out is to transmit, and he did.
The debate over whether humanity should, which goes by the name of active SETI or
messaging to extraterrestrial intelligence, continues, and this explanation is one of
the main arguments on the side of sending."""
standing = "Widely acknowledged as a real asymmetry in the search, and one of the standing arguments in the debate over whether humanity should transmit; as an explanation of the silence it is considered partial, since it says nothing about settlement or about civilisations much older than ours."
would_strengthen = "A detected civilisation found by its faint leakage rather than by a beacon, suggesting that nobody transmits on purpose; a survey of Earth's own detectability showing that our leakage would be invisible from the nearest stars, which would make the same true of others."
would_weaken = "Detection of a deliberate beacon; evidence that civilisations generally expand and settle other stars, which would make their silence in the radio bands beside the point; a strong case that long-lived civilisations eventually transmit."
related = ["shouting-is-costly", "dark-forest", "not-looked-long-enough", "listening-the-wrong-way", "no-interest-in-contact"]

verify = [
  "That Zaitsev's 'The SETI Paradox' is arXiv:physics/0611283 from 2006; check.",
  "That the Yevpatoria transmissions were in 1999, 2001, 2003 and 2008 and that Zaitsev led them; check.",
