id = "shouting-is-costly"
name = "Shouting is costly: a beacon that could be heard across the galaxy is expensive to run, so anyone sending one sends short pulses, rarely, and our searches almost never catch them"
family = "unseen"
proposed_by = "Gregory Benford, James Benford and Dominic Benford"
proposed_in = 2010
proposed_source = "'Messaging with Cost-Optimized Interstellar Beacons' and 'Searching for Cost-Optimized Interstellar Beacons', Astrobiology 10, 475–490 and 491–498 (2010)"
summary = """
The searches were designed to find a steady, powerful signal aimed at us or at
everyone. But a transmitter that could be heard across thousands of light-years would
cost a great deal to run, and any civilisation that counted the cost would do what
lighthouses do: flash briefly, sweep the beam around, and repeat on a long cycle. A
search that points at a star for a few minutes would almost never be looking at the
moment the beam swept past. On this view the galaxy may contain beacons by the hundred,
each announcing itself as cheaply as it can, and our searches have been looking for a
light that is always on."""
body = """
Three members of the Benford family, two physicists and a NASA astronomer, published a
pair of papers in 2010 asking a question the search community had mostly skipped: if you
were building a beacon to announce yourself to the galaxy, and you had a budget, how
would you build it? The answer, worked out from the physics of radio transmission and the
economics of large projects on Earth, was nothing like the signal the searches look for.
A continuous, all-directions signal strong enough to be heard across the galaxy would
be enormously powerful and expensive. The cheap alternative is a narrow beam, far more
powerful for the same energy, swept across the sky so that each target gets a short
pulse every so often. The pulse could be seconds long and the return interval months or
years. The frequency would be higher than the searches had favoured, because higher
frequencies carry further for the same cost. And the beacon would most likely be pointed
along the plane of the galaxy, where the stars are, which is also where the searches have
the most trouble with background noise.

The consequence for the searches, worked out in the second paper, is that almost all of
them would have missed such a beacon. A search that looks at a star for a few minutes
and then moves on would catch the pulse only by luck. Even a long stare at one star would
miss a beacon on a year-long cycle. The Benfords argued that the right strategy was to
stare at the galactic plane for long stretches and look for brief, repeating pulses, and
that the absence of detections so far said little about how many beacons existed.

The bearing on the Drake Equation is on the share of intelligent civilisations that are
detectable, which this explanation lowers in a specific sense: the civilisations are
transmitting, but switched on toward any one listener for so small a share of the time
that detection requires a different kind of
search. It belongs with the explanations that say the silence is about how we listen.

The objections: a civilisation that can afford interstellar beacons can probably afford
a continuous one, so the cost argument may apply only to civilisations near our own
level; beacons of the kind described would still be found eventually by the wide-field,
long-duration searches now being built; and the argument assumes a civilisation wants to
be found at all, which several other explanations deny. The Benfords accepted the first
point and noted that it was a reason to expect young civilisations' beacons to be the
first found, if any are. The argument's lasting effect has been on search design rather
than on belief: surveys that watch large parts of the sky continuously for brief
signals are now standard, and they are the test of this explanation."""
standing = "Respected and influential on how searches are planned; as an explanation of the silence it is regarded as partial, applying to deliberate beacons from civilisations that count the cost, and testable by the long-stare surveys now running."
would_strengthen = "Detection of a brief, repeating, artificial radio pulse by a long-stare survey of the plane of the galaxy, where most of its stars lie; a published count showing that past searches had almost no sensitivity to signals that are switched on only a small share of the time."
would_weaken = "Years of continuous wide-field monitoring of the plane of the galaxy with no brief artificial signal; a detection of a continuous beacon, which would show that at least some civilisations do not economise."
related = ["everyone-listens-nobody-transmits", "not-looked-long-enough", "listening-the-wrong-way", "dark-forest", "interstellar-travel-impractical"]

notes = """
Checked 2026-10-16. Both papers are in Astrobiology 10 (5), June 2010: Messaging, pages
475-490 (https://doi.org/10.1089/ast.2009.0393) and Searching, pages 491-498
(https://doi.org/10.1089/ast.2009.0394). The preprints (https://arxiv.org/abs/0810.3964 and
https://arxiv.org/abs/0810.3966) support the conclusions given: short dwell times and
infrequent revisits, higher microwave frequencies near 10 gigahertz, and a strategy of
watching the plane of the galaxy for years for brief repeating pulses. A galactic-scale beacon
needs more than 10^17 watts of effective radiated power. Corrected 2026-10-16: the body had said a
continuous all-directions signal would need power "on the scale of a nation"; that phrase is not in
the papers, which call such a beacon enormously powerful and expensive (the second paper) and put
the cost of beaming quasi-continuously into the whole sky at ten times that of the narrow-beam
design (the first), so the body now uses their wording. Pulse lengths of about a second and
revisit times of a day to a year are in the papers. The authors are Gregory Benford and
James Benford (identical twins, both physicists) and Dominic Benford (James's eldest child,
NASA's chief technologist for astrophysics): https://en.wikipedia.org/wiki/James_Benford and
https://en.wikipedia.org/wiki/Gregory_Benford.
"""

[[bears_on]]
factor = "detectable"
