(https://slate.com/technology/2013/09/green-bank-conference-seti-frank-drakes-equation-for-estimating-the-extraterrestrial-life.html,
adapted from his book Five Billion Years of Solitude); that account also ties the "technological
adolescence" worry to Morrison at the meeting. The body now says this. No change to the id,
family, bears_on or the would_strengthen and would_weaken lines.
"""

