# Explanation record: the inward turn. Layout in docs/record-schema.md.
# Written 2026-10-16. The id is this page's public address (/explanations/inward-turn/)
# and is never renamed.

id = "inward-turn"
name = "The inward turn: once a civilisation can build worlds of its own, made to measure and always rewarding, it stops bothering with the real one"
family = "unseen"
proposed_by = "Geoffrey Miller"
proposed_in = 2006
proposed_source = "'Why We Haven't Met Any Aliens', Seed magazine, 2006-05-01 (an earlier form is his answer to Edge.org's 2006 annual question, 'Runaway consumerism explains the Fermi Paradox')"
summary = """
Minds evolved to chase things that once meant survival: food, status, company,
curiosity. Technology learns to deliver the feeling of those things without the things
themselves, and it gets better at it every year. The evolutionary psychologist Geoffrey
Miller suggested in 2006 that this is where every technical civilisation goes: into
entertainment, simulation and pleasure so well tuned to its makers' minds that the slow,
difficult, unrewarding work of exploring space cannot compete. Those who give in
put more into pleasure and less into their children, and most such species slowly die
out. The galaxy is quiet because the civilisations are looking in, and the inside is
better."""
body = """
Geoffrey Miller's short essay made an argument from how minds work rather than from
physics. Animals, including humans, are driven by rewards that evolution attached to
useful behaviour: sugar tastes good because it was once rare fuel, company feels good
because lone humans died, novelty is exciting because it once meant opportunity. A
technology that can produce the reward without the behaviour short-circuits the system.
Humans had already built such technologies, Miller noted, from fast food and pornography
to video games, and he saw the trend running toward ever more absorbing versions: actually
colonising the galaxy would be so much harder than pretending to have done it. He
suggested that a period of this kind of self-absorption is probably unavoidable for any
technological species, that such species forget to send signals or to settle other worlds,
and that most of them die out slowly, putting more of their time and resources into
pleasure and less into their children. He added a twist: personalities differ in ways that
are inherited, so some family lines resist the temptation, stay practical and keep having
children, and those lines inherit the world. He pictured an eventual meeting between
civilisations as a meeting among such survivors, not among game-players.

The idea had been expressed in fiction many times before and has been since, and it has
cousins elsewhere in the catalogue: transcension, where the inward turn is physical and
final; aestivation, where the civilisation sleeps rather than plays; burn-out, where it
stops expanding because it must. Miller's version is distinctive in making the turn a
matter of psychology that every evolved mind is subject to, and so a prediction about
aliens from a fact about us.

The bearing on the Drake Equation is on the share of intelligent civilisations that are
detectable, which this view lowers for every civilisation that reaches the stage of
building its own worlds, and perhaps on the detectable lifetime, since the loud and
expansive phase would end as soon as the better alternative arrived.

The objections are the usual ones for a sociological explanation, with one of its own. It
must apply to every civilisation, since one exception would be enough to break the
silence, and a civilisation whose members are all absorbed in simulations still needs
power, which means industry, which means waste heat that could in principle be seen. The
objection of its own: a civilisation absorbed in artificial worlds would want ever more
computing power to run them, and the obvious source of more power is the stars, so the
inward turn might drive expansion rather than end it. Miller's essay does not take up this objection."""
standing = "A popular and plausible-sounding idea, often raised in public discussion; it has had little formal development and researchers regard it as one more version of 'they lost interest', with the same difficulty that it has to hold for everyone."
would_strengthen = "Evidence from Earth's own trajectory of declining interest in exploration as immersive technologies improve; a detected civilisation whose only visible trace is the waste heat of large-scale computing with no sign of expansion; a theoretical argument that evolved minds generally succumb to artificial reward."
would_weaken = "A detected civilisation that is expanding; evidence that the demand for computing power drives civilisations to harvest the energy of stars, which would be visible; humanity's continued investment in exploration alongside ever better entertainment."
related = ["transcension", "aestivation", "no-interest-in-contact", "civilisations-burn-out", "they-became-machines"]

notes = "Corrected 2026-10-16. The essay is as cited: Seed magazine, 2006-05-01, 'Why We Haven't Met Any Aliens', by Geoffrey Miller; the Seed page itself could not be reached tonight, so the title, date and text were read from a copy posted to the SL4 mailing list on 2006-05-02 (http://sl4.org/archive/0605/14720.html). An earlier form of the same argument is his answer to Edge.org's 2006 annual question, titled 'Runaway consumerism explains the Fermi Paradox' (https://www.edge.org/response-detail/11475), now named in proposed_source. Three statements did not match the essay and were rewritten in summary and body: that people still interested in the real universe become a shrinking minority that is outbred (Miller says species that give in to the temptation die out slowly, and family lines that resist it inherit the world); that the civilisation might end up 'small, poor and quiet' (not in the essay); and that Miller replied to the objection that a simulating civilisation would want more power (the essay does not raise it). The bearing on the detectable lifetime and the factors in bears_on are unchanged."


[[bears_on]]
factor = "detectable"
direction = "lowers"

[[bears_on]]
factor = "lifetime"
direction = "lowers"
