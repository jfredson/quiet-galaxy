# Explanation record: the planetarium. Layout in docs/record-schema.md.
# Written 2026-10-16. The id is this page's public address (/explanations/planetarium/)
# and is never renamed.

id = "planetarium"
name = "The planetarium: an advanced civilisation is projecting an empty sky around us so that we believe we are alone"
family = "unseen"
proposed_by = "Stephen Baxter"
proposed_in = 2001
proposed_source = "'The Planetarium Hypothesis: A Resolution of the Fermi Paradox', Journal of the British Interplanetary Society 54, 210–216 (2001)"
summary = """
A planetarium shows an audience a sky that is not really there. The planetarium
hypothesis says the sky we see is one of these: a civilisation far beyond us has built
a false sky around us, whether a shell of some kind around the solar system or a whole
artificial universe, that shows us a universe empty of anyone else, either to protect us,
to study us, or for reasons we cannot guess. It is the
zoo hypothesis with the fence made invisible. The silence is manufactured, and we are the
only ones who do not know it."""
body = """
The novelist Stephen Baxter, who writes science fiction with a strong grounding in physics,
put the idea forward in a 2001 paper. He proposed that we may be living in an artificial
universe, a kind of virtual-reality planetarium, designed to give us the illusion that the
universe is empty, and he treated the question as an engineering problem: how much energy
would it take to build such a thing, at different sizes and different levels of quality?
The paper's abstract gives his answer. A perfect simulation of present-day human
civilisation would be within reach of a civilisation of the highest rank on the scale
Nikolai Kardashev drew up, one that commands the energy output of a whole galaxy (Baxter
calls it K3). But a single human culture spread across about a hundred light-years would
be more than any conceivable generator of virtual realities could handle. On that
reckoning a civilisation of that rank could keep a show running around a people of our size,
and we would see what we see: stars, planets, galaxies, and no one in them.

The idea is the oldest kind of philosophical worry, that the senses might be deceived by
a powerful being, given a physical budget. In Baxter's own version it is a form of the
simulation hypothesis, built for one purpose, which is to hide everyone else from us.
A lighter version, in which we and the solar system are real and only the sky beyond is
faked, would need less than a whole artificial universe, but that is not the version his
abstract describes. It differs from the zoo hypothesis in that the zoo keepers merely stay
out of sight, whereas here they actively paint the walls.

The bearing on the Drake Equation is that the observations the equation is meant to
explain are themselves in question: the factors are left unchanged, and the silence is
put down to a deliberate deception. That is why the explanation sits in the "unseen"
family and why it is usually mentioned as a limiting case rather than a candidate.

The usual objections are these. The hypothesis cannot be tested from inside, except by
finding a flaw in the show, and any flaw found could be dismissed as part of the show.
A deception that has to keep pace with better instruments would get more expensive every
decade, and there might come a point at which the keepers either let it slip or spend
absurd resources to maintain it. And the hypothesis gives no reason why a civilisation
would go to such lengths, beyond the reasons given for the zoo. Baxter's abstract points
to a limit of its own: a show that has to cover a culture spread over about a hundred
light-years is beyond any conceivable generator, so it works only for a people who stay
at home. The value of the idea is in showing how little the silence alone can prove,
since any observation at all is compatible with a sufficiently capable deceiver."""
standing = "A thought experiment from a science fiction writer with a physics background, cited in surveys as the extreme case of the 'they are hiding from us' family; nobody defends it as likely, and its value is in making clear what the silence can and cannot prove."
would_strengthen = "An observation that behaves like a seam in the sky, such as a region where physical law or the distribution of stars changes inexplicably at a fixed distance from the Sun; evidence that distant observations change in response to what our instruments can resolve."
would_weaken = "Measurements from probes far outside the solar system matching what was predicted from inside it; the sheer improbability of maintaining the deception against ever better instruments; a detected civilisation, which would mean the show had failed."
related = ["simulation", "zoo-hypothesis", "they-are-already-here", "dark-forest"]

notes = """
Checked 2026-10-16 against the British Interplanetary Society's listing of the paper
(https://bis-space.com/shop/product/the-planetarium-hypothesis-a-resolution-of-the-fermi-paradox/,
reference code 2001.54.210): the citation (Journal of the British Interplanetary Society 54,
210-216, 2001) is correct. Corrected 2026-10-16: the first draft described Baxter's
planetarium as a shell around the solar system with real inhabitants inside, said Baxter
priced a false sky "around a region the size of the solar system", said a perfect copy of the
observable universe was ruled out as needing more energy than the universe holds, and
credited Baxter with the objections and the closing judgement. The abstract instead
describes an artificial universe, a virtual-reality planetarium; says a perfect simulation of
present-day human civilisation is within reach of a K3 (galaxy-scale) civilisation; and says a
human culture spanning about a hundred light-years would exceed any conceivable generator.
The summary and body now say that. The statements the abstract does not support (the
solar-system-sized region, the universe-sized limit, "fool only the instruments", Baxter's own
objections and conclusion) were removed or no longer credited to him. Only the abstract was
read; the full paper was not reached. The related simulation page's sentence contrasting the
two ideas was reworded to match. No change to the id, family, the direction under bears_on,
or the would_strengthen and would_weaken lines.
"""

[[bears_on]]
factor = "detectable"
direction = "unchanged"
