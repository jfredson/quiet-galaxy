found = "Sheikh and colleagues published the design and trial results of the Allen Telescope Array's anti-solar point survey (arXiv 2611.17376, 2026-11-11; The Astronomical Journal 172, 288; abstract and full text opened). They show that no earlier radio search had watched this long-proposed place at the right time, calling its earlier coverage essentially zero, and their three-night trial found no signal from 1 to 2.4 GHz while covering about 0.8 percent of the planned survey. This is a measured example of the gaps in past searches that the test describes; the SETI listing had nothing else in the window, its next newest entry being the ten-year UCLA search of 2026-05-06."
sources = ["https://arxiv.org/abs/2611.17376", "https://doi.org/10.3847/1538-3881/aeaa59"]
publications = ["sheikh-2026"]
