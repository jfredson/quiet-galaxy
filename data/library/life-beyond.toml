link = "https://www.youtube.com/watch?v=SUelbSa-OkA"
how = """
Three films of half an hour each, built from narration by scientists over simulated
images of alien worlds and minds. The first chapter walks through the Drake Equation
factor by factor, from the number of planets to the chance that life starts, and is
careful to say which numbers are measured and which are guesses. The second imagines what
life elsewhere might look like and how different it could be from ours; the third follows
intelligence past biology into machines and beyond, and ends on the silence. The series
is the most cinematic plain-language introduction to the equation and the catalogue, and
it does not pretend to know the answer. The year given is for the first chapter; the
second appeared in 2020 and the third in 2021, and a fourth chapter, on panspermia, in 2026."""
worth_the_time = "Yes, for a first evening with the subject, in the order they were made; they are slow by design and best watched on a large screen."

