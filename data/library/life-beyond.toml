id = "life-beyond"
title = "Life Beyond (chapters 1 to 3)"
maker = "John D. Boswell (melodysheep, YouTube channel)"
year = 2019
kind = "video"
explanations = ["rare-earth", "great-filter-ahead", "they-became-machines", "transcension", "not-looked-long-enough"]
factors = ["habitable-planets", "life", "intelligence", "detectable"]
link = "https://www.youtube.com/watch?v=SUelbSa-OkA"
how = """
Three films, 30, 38 and 43 minutes long, made by John D. Boswell as melodysheep: simulated images
of worlds and minds under narration and, in the first two, soundbites from scientists. The first
chapter asks what life needs (energy, heavy elements, liquid water), notes that life began on Earth
almost as soon as conditions allowed, counts the worlds that might host it (the film says up to a
quarter of stars have a rocky planet in the habitable zone, some 50 billion such worlds in the
galaxy), turns to ocean moons such as Enceladus and Titan, and ends on deep time and whether Earth
is a latecomer; it does not walk through the Drake Equation. The second, 'The Museum of Alien Life',
tours the forms life might take, from life as we know it and convergent evolution to exotic
biochemistries, plasma and inorganic life and life on neutron stars, with a section on machine
intelligence near the end. The third, 'In Search of Giants', is about the search for intelligent
life: how we have looked, how aliens might communicate, how advanced they might be and what contact
would mean; its captions name the Fermi paradox, the Kardashev scale and technosignatures such as
Dyson swarms. The series is a cinematic plain-language introduction to the question and the
catalogue. The year given is for the first chapter; the second appeared in 2020 and the third in
2021, and a fourth chapter, on panspermia, in 2026."""
worth_the_time = "Yes, for a first evening with the subject, in the order they were made; they are slow by design and best watched on a large screen."

notes = "Written 2026-10-16. Corrected 2026-10-16 against the channel: chapter 1 was published 2019-11-20, chapter 2 on 2020-10-07 and chapter 3 on 2021-12-07 (the record said 2022); the old link to chapter 1 now says the video is unavailable, and the new one is chapter 1's current page; a fourth chapter was published on 2026-01-14. Checked 2026-10-17 against the three films' own pages and captions on the melodysheep channel (chapter 1, https://www.youtube.com/watch?v=SUelbSa-OkA, 30:26; chapter 2, https://www.youtube.com/watch?v=ThDYazipjSI, 38:00, with the channel's own chapter markers; chapter 3, https://www.youtube.com/watch?v=saWNMPL5ygk, 42:39; chapter 4, titled 'PANSPERMIA: The Radical Theory of Life's Origins | Life Beyond 4', 28:47): the films' captions were read rather than watched, so what each covers is described from the first chapter's uploader captions, the second's chapter markers and description, and the third's description and fan captions. Corrected: the description said the first chapter walks through the Drake Equation factor by factor and says which numbers are measured and which are guesses; its captions never mention the equation, so that is removed. It also said the third chapter follows intelligence into machines and ends on the silence; the third's captions and description are about the search, communication and how advanced civilisations might be, and the machine-intelligence section is in the second, so the description now says that. The films run 30 to 43 minutes, not half an hour each."
