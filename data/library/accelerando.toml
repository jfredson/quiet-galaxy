how = """
Three generations of one family live through the century in which humanity's machines
outgrow it, dismantle the inner planets to build a thinking shell around the Sun, and lose
interest in anything as slow as a journey to another star. Stross's answer to the Fermi
question is stated outright by his characters: a civilisation that converts its solar
system into computing power does not travel, because every light-year of distance is an
unbearable delay to a mind that thinks in nanoseconds, and it does not broadcast, because
it has nothing to say to anything that slow. The old civilisations are all still at home,
turned inward, and the galaxy's silence is the sound of everyone minding their own
business at the speed of light. The chapters were published as stories from 2001."""
worth_the_time = "Yes, for readers who want the inward turn argued with energy and jokes; it is dense with ideas of its moment and some have aged, but the central argument has not."

