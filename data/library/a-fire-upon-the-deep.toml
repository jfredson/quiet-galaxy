how = """
Vinge divides the galaxy into zones by distance from the core. Near the centre, in the
Unthinking Depths, no mind can work at all; in the Slow Zone that holds Earth, nothing
travels faster than light and computers stay dumb; further out, in the Beyond, travel
between stars and real artificial minds become possible; and at the rim, in the
Transcend, civilisations become something like gods and lose interest in everything
below. It is a made-up physics, but it does two things for the paradox at once: it gives a
reason travel to us might be impossible even for species who travel freely elsewhere, and
it shows what a region full of civilisations that have grown past us would look like from
down here, which is to say quiet."""
worth_the_time = "Yes, for readers who like a big galaxy and a clever premise; it is a long adventure novel with the idea built into its map rather than argued."

