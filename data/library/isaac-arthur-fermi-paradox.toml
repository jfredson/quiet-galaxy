how = """
A long-running set of half-hour episodes, each taking one proposed explanation for the
silence and testing it against what we know about physics, engineering and how living
things spread. Arthur's standing argument is that most 'they are hiding' and 'they all
died' explanations fail the same test: they need every civilisation, without exception, to
behave the same way for millions of years, and one exception is enough to fill the galaxy.
He is therefore most sympathetic to the explanations that make us rare or early. The
series is the most thorough plain-spoken survey of the catalogue anywhere, and the place
to go when a single explanation needs an hour rather than a paragraph. The year given is
when the series began; it has continued since."""
worth_the_time = "Yes, as a reference rather than a binge: pick the episode for the explanation you are weighing, and start with the 'Fermi Paradox Compendium' episode."

verify = [
